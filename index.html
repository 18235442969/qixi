function drawReqHearts(){
  for(const h of reqHearts){
    if(h.got) continue;
    const sc=(11+Math.sin(T*3+h.x*0.1)*1.6)*S;
    const pu=.5+.5*Math.sin(T*2.6+h.y*0.1);
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,110,170,'+(0.10+0.10*pu).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(h.x,h.y,sc*(2.0+0.5*pu),0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(255,170,215,'+(0.35+0.3*pu).toFixed(3)+')'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(h.x,h.y,sc*1.9,0,TAU); ctx.stroke();
    ctx.restore();
    drawHeart(h.x,h.y,sc,'#ff5f9e','#ffc2dc');
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,255,255,'+(0.5+0.5*pu).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(h.x-sc*.35,h.y-sc*.45,sc*.16+0.6,0,TAU); ctx.fill(); ctx.restore();
  }
}
function drawHeart(x,y,s,c1,c2,alpha){
  if(alpha===undefined) alpha=1;
  ctx.save(); ctx.globalAlpha=alpha;
  const g=ctx.createLinearGradient(x,y-s,x,y+s);
  g.addColorStop(0,c2); g.addColorStop(1,c1);
  ctx.fillStyle=g; ctx.beginPath();
  ctx.moveTo(x,y+s*.85);
  ctx.bezierCurveTo(x-s*1.15,y+s*.12,x-s*.9,y-s*.78,x,y-s*.28);
  ctx.bezierCurveTo(x+s*.9,y-s*.78,x+s*1.15,y+s*.12,x,y+s*.85);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawParticles(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const p of particles){
    const a=clamp(p.life/p.max,0,1);
    if(p.type==='ring'){
      const r=p.size+(1-a)*36;
      ctx.strokeStyle='rgba(255,180,215,'+(a*.7).toFixed(3)+')'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.stroke();
    }else if(p.type==='heart'){
      drawHeart(p.x,p.y,p.size*a+2,'rgba(0,0,0,0)',p.color, a);
      drawHeart(p.x,p.y,p.size*a+6,'rgba(0,0,0,0)',p.color, a*.5);
    }else if(p.type==='fire'){
      ctx.fillStyle=p.color; ctx.globalAlpha=a;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a+.3,0,TAU); ctx.fill(); ctx.globalAlpha=1;
    }else if(p.type==='form'){
      const t=clamp((T-p.born)/1.1,0,1), e=1-Math.pow(1-t,3);
      const x=lerp(p.x,p.tx,e), y=lerp(p.y,p.ty,e);
      const tw=.5+.5*Math.sin(T*6+p.tx);
      ctx.fillStyle=p.color; ctx.globalAlpha=a*(0.55+0.45*tw);
      ctx.beginPath(); ctx.arc(x,y,p.size,0,TAU); ctx.fill(); ctx.globalAlpha=1;
    }
  }
  ctx.restore();
}
function drawHint(){
  if(phase!=='play') return;
  if(T-lastLeftStroke<=3.2) return;
  const pl=.5+.5*Math.sin(T*4);
  ctx.save();
  ctx.strokeStyle='rgba(255,200,235,'+((.35+.4*pl)).toFixed(3)+')'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(charL.x, charL.y-30*S, 24*S+pl*7, 0, TAU); ctx.stroke();
  ctx.font=Math.round(22*S)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('👆', charL.x, charL.y-78*S - Math.abs(Math.sin(T*4))*10);
  ctx.font=Math.round(15*S)+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle='rgba(255,220,240,'+((.6+.35*pl)).toFixed(3)+')';
  ctx.fillText('从猴子一笔画到emma，穿过所有爱心', W/2, H*0.24);
  ctx.fillText('（一笔完成 · 线条不能交叉 · 不能断笔）', W/2, H*0.24+20*S);

}
function draw(){
  drawSky();
  drawBank(charL.x); drawBank(charR.x);
  if(phase==='play'||phase==='walk'||phase==='meet'||phase==='end') drawBridge();
  drawReqHearts();

    const pL=posAt(walkDL), pR=posAt(walkDR);
    const fL=(posAt(Math.min(walkDL+4,walkTotal)).x-pL.x)>=0?1:-1;
    const fR=(posAt(Math.max(walkDR-4,0)).x-pR.x)>=0?1:-1;
    drawAvatar('L',pL.x,pL.y,S, fL,true,walkDL*.16); label('猴子',pL.x,pL.y+8,'rgba(170,215,255,.9)');
    drawAvatar('R',pR.x,pR.y,S, fR,true,(walkTotal-walkDR)*.16); label('emma',pR.x,pR.y+8,'rgba(255,205,235,.9)');
  }else if(phase==='meet'||phase==='end'){

    drawAvatar('R',p.x+15*S,p.y,S,-1,false,0); label('emma',p.x+15*S,p.y+8,'rgba(255,205,235,.9)');
  }
  drawParticles();
  drawHint();
  if(T-flashT<0.35){                              // 失败红闪
    ctx.fillStyle='rgba(255,60,90,'+(0.30*(1-(T-flashT)/0.35)).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
}

/* ---------------- 主循环 ---------------- */
let lastTs=performance.now();
function loop(ts){
  if(!running) return;                        // v6：未激活不跑循环
  const dt=Math.min(.05,(ts-lastTs)/1000); lastTs=ts; T+=dt;
  update(dt); draw();
  rafId=requestAnimationFrame(loop);
}

/* ---------------- 交互（触摸/鼠标统一） ---------------- */
function ptOf(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
cv.addEventListener('pointerdown', function(e){
  if(!running) return;                        // v6：游戏未激活不响应
  AU.init(); AU.resume();
  const p=ptOf(e);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(phase==='play'){
    if(p.x > leftBound+W*0.08){                    // 必须从猴子出发
      toast('要从猴子这里开始画哦 👈', 1800);
      return;
    }
    drawing=true; lastLeftStroke=T;
    addPathPoint(p.x,p.y); ripple(p.x,p.y);
  }else if(phase==='walk'||phase==='meet'||phase==='end'){
    ripple(p.x,p.y); burstHearts(p.x,p.y,4,60); AU.pop();
  }
},{passive:true});
cv.addEventListener('pointermove', function(e){
  if(!running) return;                        // v6
  if(!drawing || phase!=='play') return;
  const p=ptOf(e); addPathPoint(p.x,p.y);
},{passive:true});
function endStroke(){
  if(!drawing) return; drawing=false;
  if(phase==='play' && pts.length && pts[pts.length-1].x < rightBound-W*0.02)
    failRound('断笔啦！要一笔画到emma', pts[pts.length-1].x, pts[pts.length-1].y);
}
cv.addEventListener('pointerup', endStroke,{passive:true});
cv.addEventListener('pointercancel', endStroke,{passive:true});

/* ---------------- 排行榜（localStorage 本机记录） ---------------- */
const BOARD_KEY='qixi.board.v1';
function loadBoard(){
  try{ return JSON.parse(localStorage.getItem(BOARD_KEY)||'[]'); }catch(e){ return []; }
}
function fmtDate(ts){
  const d=new Date(ts), p=n=>(n<10?'0':'')+n;
  return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function saveRecord(ts){                         // 记录本轮：喜鹊数多者胜，同数比用时
  const b=loadBoard();
  b.push({m:birdsDone, n:heartsTotal, t:+(doneT-playStartT).toFixed(1), d:fmtDate(ts),
          w:($('meName').value.trim()||'猴子')+' ❤ '+($('taName').value.trim()||'emma'), ts:ts});
  b.sort(function(x,y){ return (y.m-x.m)||(x.t-y.t); });
  const top=b.slice(0,10);
  try{ localStorage.setItem(BOARD_KEY, JSON.stringify(top)); }catch(e){}

}
function renderBoard(newTs){

  const el=$('boardList');

    el.innerHTML='<p class="tip" style="text-align:center">还没有记录<br>完成一局，为TA搭起最长的鹊桥 🐦</p>';

  let W = 0, H = 0, DPR = 1, tNow = 0, lastT = 0, rafId = 0, running = false, tick = 0;
  let stars = [], flow = [], shoots = [], hearts = [];
  let shootNext = 3, heartNext = 2.5;
  /* v7 修正：银河带"隐约可见"参数（原 0.07 峰值/0.26 带宽/80 流动点在文字后过亮过密）
   * peak ≤0.035 / dots ≤50 / maxDotAlpha ≤0.16 / bandRatio ≤0.18 为 harness 回归阈值
   * v7 二次修正（执行器限额熔断，主 Agent 应急微调）：再调暗、带上移避开标题/副标题区 */
  const MILKY = { peak: 0.032, dots: 42, dotA: 0.04, dotAVar: 0.08, bandRatio: 0.12, yRatio: 0.11, cyRatio: 0.26 };

  function build() {
    stars = [];
    const n = clamp2(Math.round(W * H / 9000), 50, 150);   // 数量随屏幕缩放，移动端不卡
    const hues = ['255,255,255', '255,255,255', '196,214,255', '255,224,238'];
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: 0.4 + Math.random() * 1.3, ph: Math.random() * TAU2, sp: 0.5 + Math.random() * 1.8,
        hue: pick2(hues), base: 0.3 + Math.random() * 0.55,
      });
    }
    flow = [];   // 银河微光：沿斜带的缓慢流动薄雾（v7 修正：更少更暗更柔）
    const len = Math.hypot(W, H);
    for (let i = 0; i < MILKY.dots; i++) {
      flow.push({
        off: Math.random() * len, spd: rand2(6, 18),
        y0: (Math.random() + Math.random() - 1) * Math.min(W, H) * MILKY.yRatio,
        r: 0.9 + Math.random() * 1.5, a: MILKY.dotA + Math.random() * MILKY.dotAVar, ph: Math.random() * TAU2,
      });
    }
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  function update(dt) {
    // 流星：每 4~9 秒一颗
    shootNext -= dt;
    if (shootNext <= 0) {
      shootNext = rand2(4, 9);
      const ang = (Math.random() < 0.5 ? Math.PI * 0.75 : Math.PI * 0.25) + rand2(-0.1, 0.1);
      const sp = rand2(600, 950);
      shoots.push({
        x: W * rand2(0.15, 0.85), y: H * rand2(0.05, 0.3),
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, age: 0, life: rand2(0.7, 1.1),
      });
    }
    for (let i = shoots.length - 1; i >= 0; i--) {
      const s = shoots[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.age += dt;
      if (s.age >= s.life) shoots.splice(i, 1);
    }
    // 飘心：偶尔从底部缓缓飘起
    heartNext -= dt;
    if (heartNext <= 0) {
      heartNext = rand2(2, 4.5);
      const n = 1 + (Math.random() < 0.35 ? 1 : 0);
      for (let i = 0; i < n; i++) {
        hearts.push({
          x: W * rand2(0.1, 0.9), y: H + 12,
          vy: -rand2(16, 34), sway: rand2(10, 26), ph: Math.random() * TAU2,
          size: rand2(5, 10), life: rand2(4.5, 7), age: 0,
          color: pick2(['255,143,187', '255,117,142', '255,179,205', '255,209,102']),
        });
      }
    }
    for (let i = hearts.length - 1; i >= 0; i--) {
      const p = hearts[i];
      p.age += dt;
      p.y += p.vy * dt;
      p.x += Math.sin(p.age * 1.8 + p.ph) * p.sway * dt;
      if (p.age >= p.life || p.y < -20) hearts.splice(i, 1);
    }
  }

  function drawHeart(x, y, s, rgb, alpha) {
    g.save();
    g.translate(x, y); g.scale(s, s);
    g.globalAlpha = alpha;
    g.fillStyle = 'rgb(' + rgb + ')';
    g.beginPath();
    g.moveTo(0, 0.32);
    g.bezierCurveTo(-0.55, -0.02, -0.36, -0.44, 0, -0.18);
    g.bezierCurveTo(0.36, -0.44, 0.55, -0.02, 0, 0.32);
    g.closePath();
    g.fill();
    g.restore();
  }

  function render() {
    g.clearRect(0, 0, W, H);   // v7 三次修正：每帧清屏，否则星星/银河/飘心逐帧叠加（亮度累积、飘心拖出长轨迹）
    // 星星（呼吸闪烁）
    for (const s of stars) {
      const a = s.base * (0.45 + 0.55 * Math.sin(tNow * s.sp + s.ph));
      g.fillStyle = 'rgba(' + s.hue + ',' + a.toFixed(3) + ')';
      g.beginPath();
      g.arc(s.x, s.y, s.r, 0, TAU2);
      g.fill();
    }
    // 银河微光带（v7 修正：收窄调暗；二次修正：中心上移至头像区后方，标题/副标题/卡片落在干净夜空上）
    const angle = -0.30, cx = W * 0.5, cy = H * MILKY.cyRatio;
    const len = Math.hypot(W, H) * 0.75, bandHalf = Math.min(W, H) * MILKY.bandRatio;
    g.save();
    g.translate(cx, cy); g.rotate(angle);
    const grad = g.createLinearGradient(0, -bandHalf, 0, bandHalf);
    grad.addColorStop(0, 'rgba(170,185,255,0)');
    grad.addColorStop(0.5, 'rgba(200,212,255,' + MILKY.peak + ')');
    grad.addColorStop(1, 'rgba(170,185,255,0)');
    g.fillStyle = grad;
    g.fillRect(-len, -bandHalf, len * 2, bandHalf * 2);
    for (const f of flow) {
      const x = ((f.off + tNow * f.spd) % (len * 2)) - len;   // 循环流动
      const a = f.a * (0.5 + 0.5 * Math.sin(tNow * 1.2 + f.ph));
      if (a <= 0.004) continue;
      const rr = f.r * 2.6;   // 径向渐变柔化：薄雾感而非硬点/刮痕
      const fg = g.createRadialGradient(x, f.y0, 0, x, f.y0, rr);
      fg.addColorStop(0, 'rgba(222,230,255,' + a.toFixed(3) + ')');
      fg.addColorStop(1, 'rgba(222,230,255,0)');
      g.fillStyle = fg;
      g.beginPath();
      g.arc(x, f.y0, rr, 0, TAU2);
      g.fill();
    }
    g.restore();
    // 流星拖尾
    for (const s of shoots) {
      const a = Math.sin(Math.PI * clamp2(s.age / s.life, 0, 1));
      const sp = Math.hypot(s.vx, s.vy) || 1;
      const nx = s.vx / sp, ny = s.vy / sp;
      const tl = (80 + 50 * a);
      const lg = g.createLinearGradient(s.x, s.y, s.x - nx * tl, s.y - ny * tl);
      lg.addColorStop(0, 'rgba(255,255,255,' + (0.85 * a).toFixed(3) + ')');
      lg.addColorStop(1, 'rgba(255,255,255,0)');
      g.strokeStyle = lg; g.lineWidth = 1.6; g.lineCap = 'round';
      g.beginPath();
      g.moveTo(s.x, s.y); g.lineTo(s.x - nx * tl, s.y - ny * tl);
      g.stroke();
    }
    // 飘心（半透明、上飘渐隐）
    for (const p of hearts) {
      const k = p.age / p.life;
      const a = 0.5 * Math.sin(Math.PI * clamp2(k, 0, 1));   // 出现与消失都柔和
      drawHeart(p.x, p.y, p.size, p.color, a);
    }
  }

  function loop(ts) {
    if (!running) return;
    const dt = lastT === 0 ? 0.016 : clamp2((ts - lastT) / 1000, 0, 0.05);
    lastT = ts;
    tNow += dt;
    tick++;
    update(dt);
    render();
    rafId = requestAnimationFrame(loop);
  }

  function start() {
    if (running) return;
    running = true;
    lastT = 0;
    resize();
    rafId = requestAnimationFrame(loop);
  }
  function stop() {
    if (!running) return;
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }
  window.addEventListener('resize', function () { if (running) resize(); });

  /* QA 钩子：运行状态与帧计数（供 harness 验证动效启停与随时间变化）
   * milky：银河带亮度/密度参数（v7 修正后的回归阈值载体） */
  window.__menuFx = {
    start: start,
    stop: stop,
    info: function () {
      return {
        running: running, tick: tick, entities: stars.length + flow.length + shoots.length + hearts.length,
        milky: {
          peak: MILKY.peak, dots: MILKY.dots,
          maxDotAlpha: MILKY.dotA + MILKY.dotAVar, bandRatio: MILKY.bandRatio,
        },
      };
    },
  };

  start();   // 初始菜单可见，自动开跑
})();
</script>
</body>
</html>
