<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#141a44" />
<meta name="description" content="七夕 · 鹊桥双戏：星夜集鹊 + 一笔成桥，两个小把戏都是我爱你" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>" />
<title>七夕 · 鹊桥双戏</title>
<style>
  /* ==================== v6 菜单与路由 ==================== */
  .gone { display: none !important; }   /* 三分区显隐（避免与 B 的 .screen.hidden 语义冲突） */
  #menu {
    position: fixed; inset: 0; z-index: 50; overflow-y: auto;
    background: linear-gradient(180deg, #0a0c26 0%, #141a44 45%, #2a1e56 78%, #3b2160 100%);
    display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .menu-inner { width: min(560px, 94vw); text-align: center; position: relative; z-index: 1; }
  /* v7 菜单背景动效画布：垫底、不拦截交互 */
  #menuSky { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .menu-avatars { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
  /* v7 双层结构：外层画星光环（不被裁剪），内层圆形裁剪放大后的照片 */
  .menu-av-wrap { position: relative; flex: none; }
  .menu-av-wrap::after {
    content: ''; position: absolute; inset: -8px; border-radius: 50%;
    border: 1px dashed rgba(255, 205, 235, .38);
    animation: menuSpin 26s linear infinite; pointer-events: none;
  }
  .menu-av-wrap::before {
    content: ''; position: absolute; inset: -14px; border-radius: 50%;
    border: 1px dotted rgba(170, 190, 255, .22);
    animation: menuSpin 40s linear infinite reverse; pointer-events: none;
  }
  @keyframes menuSpin { to { transform: rotate(360deg); } }
  .menu-av {
    display: block;
    width: clamp(64px, 18vw, 88px); height: clamp(64px, 18vw, 88px);
    border-radius: 50%; overflow: hidden;
    border: 3px solid rgba(255, 190, 225, .85);
    box-shadow: 0 0 22px rgba(255, 110, 180, .55);
  }
  .menu-av img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transform-origin: 50% 50%;
  }
  /* 头像二次取景（v6 修正）：源图为 288×288 方形裁剪，脸占比小且偏位，
   * 用 translate(dX%, dY%) scale(k) 放大并对准脸部，d = -k·(脸部位置% - 50%)。
   * 猴子：脸约在图内 (47.5%, 32%) → k=2.3；emma：脸约在 (72%, 57%) → k=2.5。
   * 参数经离线裁剪预览 + 视觉校验两轮收敛（中心偏差 ≤5%）。 */
  #menuAvL { transform: translate(5.75%, 41%) scale(2.3); }
  #menuAvR { transform: translate(-55%, -17%) scale(2.5); }
  .menu-heart {
    font-size: clamp(22px, 6vw, 30px); color: #ff6ea9;
    animation: beat 1.6s infinite; text-shadow: 0 0 14px rgba(255, 110, 169, .8);
  }
  .menu-title {
    font-family: "Songti SC", "STSong", "KaiTi", "STKaiti", serif;
    font-size: clamp(26px, 6vw, 42px); letter-spacing: .14em; color: #ffe9f3;
    text-shadow: 0 0 24px rgba(255, 143, 187, .6), 0 2px 12px rgba(0, 0, 0, .5);
    animation: menuGlow 4.5s ease-in-out infinite;   /* v7 柔光呼吸 */
  }
  @keyframes menuGlow {
    0%, 100% { text-shadow: 0 0 18px rgba(255, 143, 187, .45), 0 2px 12px rgba(0, 0, 0, .5); }
    50% { text-shadow: 0 0 34px rgba(255, 143, 187, .85), 0 0 60px rgba(160, 120, 255, .35), 0 2px 12px rgba(0, 0, 0, .5); }
  }
  .menu-sub {
    margin-top: 10px; font-size: clamp(13px, 3.4vw, 16px); color: rgba(255, 236, 244, .85); letter-spacing: .08em;
    animation: menuSubGlow 5.5s ease-in-out infinite;   /* v7 */
  }
  @keyframes menuSubGlow { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
  .menu-cards { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; }
  @media (min-width: 640px) and (orientation: landscape) { .menu-cards { flex-direction: row; } }
  .mcard {
    pointer-events: auto; cursor: pointer; border: 1px solid rgba(255, 182, 213, .3);
    background: linear-gradient(165deg, rgba(255, 250, 242, .96), rgba(255, 240, 246, .95));
    border-radius: 16px; padding: 16px 18px; text-align: left; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, .4); font-family: inherit; width: 100%;
    transition: transform .18s ease, box-shadow .18s ease; min-height: 84px; color: inherit;
  }
  .mcard:hover { transform: translateY(-3px); box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
  .mcard:active { transform: scale(.97); }
  .micon {
    width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 26px; flex: none;
  }
  .micon.a { background: linear-gradient(160deg, #1b2350, #3b2f7a); box-shadow: inset 0 0 18px rgba(120, 160, 255, .25); }
  .micon.b { background: linear-gradient(160deg, #2a1560, #4a2470); box-shadow: inset 0 0 18px rgba(200, 140, 255, .25); }
  .mname { font-size: clamp(16px, 4vw, 19px); font-weight: 700; color: #6b4a63; letter-spacing: .06em; }
  .mdesc { margin-top: 4px; font-size: clamp(12px, 3.2vw, 13.5px); color: #9a6b8f; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c26; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  #sky { position: fixed; inset: 0; display: block; touch-action: none; cursor: pointer; }
  #ui { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

  /* ---------- 开场大标题（数秒后淡出） ---------- */
  #title-big {
    position: absolute; top: 13%; left: 50%; transform: translate(-50%, 0);
    text-align: center; width: 92%;
  }
  #title-big.intro { animation: titleOut 1.4s ease 4.2s forwards; }   /* v6：start() 挂类，支持反复入场 */
  #title-big h1 {
    font-size: clamp(22px, 6.5vw, 52px); font-weight: 700; letter-spacing: .1em;
    line-height: 1.3; color: #ffe9f3;
    text-shadow: 0 0 26px rgba(255, 143, 187, .65), 0 0 60px rgba(160, 120, 255, .35), 0 2px 12px rgba(0, 0, 0, .5);
  }
  #title-big p {
    margin-top: 14px; font-size: clamp(12px, 3.4vw, 17px);
    color: rgba(255, 236, 244, .88); letter-spacing: .08em; line-height: 1.6;
    text-shadow: 0 1px 8px rgba(0, 0, 0, .5);
  }
  @keyframes titleOut { to { opacity: 0; transform: translate(-50%, -34px); } }

  /* ---------- 角落小标题 ---------- */
  #title-small {
    position: absolute; top: 10px; left: 14px;
    top: calc(10px + env(safe-area-inset-top));
    left: calc(14px + env(safe-area-inset-left));
    font-size: clamp(11px, 2.8vw, 13px); letter-spacing: .1em; color: rgba(255, 228, 240, .78);
    text-shadow: 0 1px 6px rgba(0, 0, 0, .6);
    opacity: 0;
  }
  #title-small.intro { animation: fadeIn 1s ease 5.1s forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- 收集进度 ---------- */
  #progress {
    position: absolute; left: 50%; bottom: 14px;
    bottom: max(14px, env(safe-area-inset-bottom));   /* 避让 Home 指示条 */
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; border-radius: 999px;
    background: rgba(20, 16, 40, .55); border: 1px solid rgba(255, 182, 213, .28);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: #ffe9f3; font-size: clamp(12px, 3.2vw, 14px); letter-spacing: .06em; white-space: nowrap;
    max-width: calc(100vw - 20px);
    opacity: 0; transition: opacity .6s ease, transform .6s ease;
  }
  #progress.show { opacity: 1; }
  #progress.hidden { opacity: 0; transform: translate(-50%, 10px); }
  .dots { display: flex; gap: 5px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255, 255, 255, .18); transition: all .3s ease;
  }
  .dot.on { background: #ff77a9; box-shadow: 0 0 8px #ff77a9; transform: scale(1.2); }

  /* ---------- 月老相助（v3 提示按钮，右下角） ---------- */
  #hint {
    position: absolute; right: 14px; bottom: 14px;
    right: calc(14px + env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom));
    pointer-events: auto; cursor: pointer;
    border: 1px solid rgba(255, 214, 140, .45);
    padding: 10px 16px; min-height: 46px; border-radius: 999px;
    background: rgba(30, 22, 46, .62);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: #ffe9c9; font-size: clamp(12px, 3.2vw, 14px); letter-spacing: .06em;
    font-family: inherit; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
    transition: opacity .35s ease, transform .2s ease, filter .2s ease;
  }
  #hint:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-2px); }
  #hint:active:not(:disabled) { transform: scale(.95); }
  #hint:disabled { opacity: .42; cursor: default; }
  #hint.hide { opacity: 0; pointer-events: none; }
  @media (orientation: portrait) {
    #hint { bottom: calc(64px + env(safe-area-inset-bottom)); }   /* 竖屏抬高于进度胶囊之上，避免重叠 */
  }

  /* ---------- 排行榜（v4）+ v6 顶栏（🏆 与 ☰ 菜单同排） ---------- */
  #ga-topbar {
    position: absolute; top: 10px; right: 14px;
    top: calc(10px + env(safe-area-inset-top));
    right: calc(14px + env(safe-area-inset-right));
    display: flex; gap: 8px; pointer-events: none;
  }
  #ga-topbar button { pointer-events: auto; }
  #board-btn {
    cursor: pointer;
    border: 1px solid rgba(255, 214, 140, .45);
    padding: 8px 14px; min-height: 40px; border-radius: 999px;
    background: rgba(30, 22, 46, .62);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: #ffe9c9; font-size: clamp(11px, 2.9vw, 13px); letter-spacing: .05em;
    font-family: inherit; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
    transition: filter .2s ease, transform .2s ease;
  }
  #board-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
  #menuA-btn {
    cursor: pointer;
    border: 1px solid rgba(255, 214, 140, .45);
    padding: 8px 14px; min-height: 40px; border-radius: 999px;
    background: rgba(30, 22, 46, .62);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: #ffe9c9; font-size: clamp(11px, 2.9vw, 13px); letter-spacing: .05em;
    font-family: inherit; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
    transition: filter .2s ease, transform .2s ease;
  }
  #menuA-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
  @media (orientation: portrait) {
    #ga-topbar { top: calc(60px + env(safe-area-inset-top)); }   /* 竖屏下移，避开右上月亮 */
  }
  #board {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden;
    transition: opacity .3s ease, visibility .3s;
  }
  #board.show { opacity: 1; visibility: visible; }
  .board-mask {
    position: absolute; inset: 0;
    background: rgba(8, 6, 20, .55);
    pointer-events: auto;
  }
  .board-panel {
    position: relative; width: min(88vw, 380px);
    max-height: 68vh; overflow-y: auto;
    padding: 20px 18px;
    background: linear-gradient(165deg, rgba(255, 250, 242, .97) 0%, rgba(255, 240, 246, .96) 100%);
    border-radius: 6px 18px 6px 18px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(255, 255, 255, .5);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    pointer-events: auto;
  }
  .board-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .board-head h3 {
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    font-size: clamp(16px, 4vw, 19px); letter-spacing: .12em; color: #a63d67; font-weight: 700;
  }
  #board-close {
    pointer-events: auto; cursor: pointer; border: none;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(166, 61, 103, .12); color: #a63d67; font-size: 14px; line-height: 1;
  }
  .board-row {
    font-size: clamp(12px, 3.2vw, 13.5px); color: #6b4a63;
    padding: 7px 4px; border-bottom: 1px dashed rgba(166, 61, 103, .18);
    letter-spacing: .03em;
  }
  .board-empty {
    text-align: center; color: #9a6b8f; font-size: clamp(13px, 3.4vw, 14px);
    padding: 26px 0; letter-spacing: .05em;
  }
  .score-line {
    margin-top: 13px; text-align: center;
    font-size: clamp(12px, 3.3vw, 13.5px); color: #a5679b; letter-spacing: .04em;
  }

  /* ---------- 情书卡片 ---------- */
  #letter {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden;
    transition: opacity .9s ease, visibility .9s;
  }
  /* 竖屏卡片居中偏上，少遮挡相会点；横屏轻微上移 */
  @media (orientation: portrait) { #letter { padding-bottom: 12vh; } }
  @media (orientation: landscape) { #letter { padding-bottom: 4vh; } }
  #letter.show { opacity: 1; visibility: visible; }
  .card {
    position: relative; width: min(92vw, 420px);
    padding: 40px 24px 28px;
    background: linear-gradient(165deg, rgba(255, 250, 242, .97) 0%, rgba(255, 240, 246, .96) 100%);
    border-radius: 6px 20px 6px 20px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(255, 255, 255, .5);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    text-align: center;
    transform: scale(.86) translateY(16px);
    transition: transform .85s cubic-bezier(.2, 1.4, .4, 1);
  }
  #letter.show .card { transform: none; }
  .card::before {
    content: ''; position: absolute; inset: 9px; pointer-events: none;
    border: 1px solid rgba(166, 61, 103, .2); border-radius: 3px 15px 3px 15px;
  }
  .seal {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff9ebb, #e5487f);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    box-shadow: 0 6px 16px rgba(229, 72, 127, .5), 0 0 0 3px rgba(255, 255, 255, .6);
  }
  .card h2 {
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    font-size: clamp(19px, 5vw, 23px); letter-spacing: .18em; color: #a63d67;
    margin: 10px 0 14px; font-weight: 700;
  }
  #letter-body p {
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    font-size: clamp(13.5px, 3.8vw, 15px); line-height: 2.05; color: #6b4a63; letter-spacing: .04em;
  }
  .sign {
    margin-top: 14px; text-align: right;
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    font-size: clamp(12px, 3.2vw, 13px); color: #9a6b8f; letter-spacing: .06em;
  }
  #replay {
    margin-top: 20px; pointer-events: auto; cursor: pointer;
    border: none; padding: 12px 30px; min-height: 48px; border-radius: 999px;
    font-size: clamp(14px, 3.8vw, 16px); letter-spacing: .1em; color: #fff; font-family: inherit;
    background: linear-gradient(135deg, #ff6b9d, #ff8f6b);
    box-shadow: 0 8px 20px rgba(255, 107, 157, .45);
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
  }
  #replay:hover { filter: brightness(1.08); transform: translateY(-2px); box-shadow: 0 12px 26px rgba(255, 107, 157, .55); }
  #replay:active { transform: scale(.95); }

  /* ==================== 游戏 B（一笔成桥）样式：全部限定在 #gameB 作用域 ==================== */
  #gameB #cv{position:fixed;inset:0;touch-action:none;display:block}
  #gameB .screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(ellipse at 50% 38%, rgba(38,24,92,.55), rgba(5,2,24,.88));
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transition:opacity .6s}
  #gameB .screen.hidden{opacity:0;pointer-events:none}
  #gameB .kai{font-family:"STKaiti","KaiTi","Kaiti SC","FZKai-Z03S","Noto Serif SC",serif}
  #gameB .card{width:min(420px,94vw);background:linear-gradient(165deg, rgba(42,28,96,.94), rgba(18,10,52,.97));
    border:1px solid rgba(255,160,210,.35);border-radius:26px;padding:30px 24px 24px;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 0 46px rgba(255,110,180,.10);
    animation:cardIn .7s cubic-bezier(.2,.9,.3,1.25) both}
  #gameB .deco{display:flex;align-items:center;justify-content:center}
  #gameB .deco img{width:56px;height:56px;border-radius:50%;object-fit:cover;
    border:2.5px solid rgba(255,180,220,.85);box-shadow:0 0 16px rgba(255,110,180,.55)}
  #gameB .deco .dj{font-size:20px;margin:0 10px;color:#ff6ea9;animation:beat 1.6s infinite}
  #gameB h1{font-size:42px;letter-spacing:10px;text-indent:10px;margin:4px 0 2px;
    background:linear-gradient(180deg,#ffe1f0,#ff8fc0 55%,#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,140,200,.35))}
  #gameB .sub{color:#b9a8e8;font-size:13px;letter-spacing:5px;margin-bottom:18px}
  #gameB .inputs{display:flex;align-items:center;gap:8px;margin:6px 0 18px}
  #gameB .inputs input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    border-radius:12px;padding:11px 8px;color:#fff;font-size:14px;text-align:center;outline:none;font-family:inherit}
  #gameB .inputs input::placeholder{color:#7d6fb0}
  #gameB .inputs input:focus{border-color:#ff8fc0;box-shadow:0 0 0 3px rgba(255,143,192,.22)}
  #gameB .heartJoin{color:#ff6ea9;font-size:15px;animation:beat 1.6s infinite}
  #gameB .btn{border:none;outline:none;background:linear-gradient(135deg,#ff6ea9,#b388ff 55%,#7ee8fa);color:#fff;
    font-size:16px;letter-spacing:3px;padding:13px 32px;border-radius:999px;font-family:inherit;cursor:pointer;
    box-shadow:0 8px 26px rgba(255,110,169,.45), inset 0 1px 0 rgba(255,255,255,.45);transition:transform .15s}
  #gameB .btn:active{transform:scale(.93)}
  #gameB .btn.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);box-shadow:none}
  #gameB .tip{color:#8f80c0;font-size:12px;margin-top:14px;line-height:1.8}
  #gameB #boardList{max-height:46vh;overflow-y:auto;text-align:left;-webkit-overflow-scrolling:touch}
  #gameB .brow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;margin:5px 0;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);color:#e9e0ff;font-size:13px}
  #gameB .brow.new{border-color:rgba(255,143,192,.7);background:rgba(255,110,169,.13)}
  #gameB .brow .rk{width:34px;text-align:center;font-size:17px;flex:none}
  #gameB .brow .bm{flex:1;min-width:0;line-height:1.55}
  #gameB .brow .bm b{color:#ffd9ec;font-size:14px}
  #gameB .brow .bd{text-align:right;color:#8f80c0;font-size:11px;line-height:1.6;flex:none}
  #gameB .story{text-align:center;max-width:520px}
  #gameB .story p{font-size:19px;color:#cfc3f5;letter-spacing:3px;margin:11px 0;opacity:0;animation:lineIn .9s both}
  #gameB .story .hl{color:#ffd9ec;font-size:22px;text-shadow:0 0 18px rgba(255,140,200,.7)}
  #gameB #storyBtn{margin-top:30px;opacity:0;animation:lineIn .8s 4.1s both}
  #gameB .ring{font-size:40px;filter:drop-shadow(0 0 14px #ff6ea9);animation:beat 1.4s infinite}
  #gameB h2{font-size:30px;letter-spacing:8px;color:#ffd9ec;text-shadow:0 0 20px rgba(255,140,200,.5);margin:4px 0 10px}
  #gameB .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,160,210,.6),transparent);margin:4px 0 12px}
  #gameB #endMsg{white-space:pre-line;color:#e9e0ff;font-size:15px;line-height:2.05;letter-spacing:1px}
  #gameB .stats{display:flex;gap:8px;margin:16px 0 4px}
  #gameB .stats>div{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 4px}
  #gameB .stats b{display:block;color:#ffd9ec;font-size:18px;font-weight:600}
  #gameB .stats span{color:#8f80c0;font-size:11px;letter-spacing:2px}
  #gameB .btnRow{display:flex;gap:10px;margin-top:18px;justify-content:center}
  #gameB .btnRow .btn{padding:12px 22px;font-size:14px}
  #gameB #hud{position:fixed;top:0;left:0;right:0;z-index:10;
    padding:calc(env(safe-area-inset-top, 0px) + 10px) 56px 0 14px;display:flex;gap:10px;align-items:center;
    transition:opacity .4s}
  #gameB #hud.hidden{opacity:0;pointer-events:none}
  /* v7 修正：☰ 独立固定右上角并高于弹层（.screen z-20），弹层打开时也可返回菜单 */
  #gameB #menuBtn{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 10px);right:14px;z-index:30}
  #gameB #progressWrap{flex:1;max-width:300px;height:20px;border-radius:999px;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16);position:relative;overflow:hidden}
  #gameB #progressBar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#7ee8fa,#b388ff,#ff8fc0);
    transition:width .25s;box-shadow:0 0 14px rgba(179,136,255,.8)}
  #gameB #progressText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;letter-spacing:2px}
  #gameB #heartChip{background:rgba(255,110,169,.16);border:1px solid rgba(255,110,169,.4);color:#ffb3d1;
    border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
  #gameB #muteBtn,#gameB #hintBtn,#gameB #menuBtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.22);color:#fff;font-size:15px;flex:none}
  #gameB #hintBtn{animation:beat 2.8s infinite}
  #gameB #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom, 0px) + 40px);z-index:40;
    transform:translateX(-50%) translateY(24px);background:rgba(22,13,58,.94);border:1px solid rgba(255,143,192,.45);
    color:#ffe3f1;padding:10px 20px;border-radius:999px;font-size:13px;letter-spacing:1px;
    opacity:0;transition:.45s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #gameB #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @keyframes cardIn{from{transform:translateY(34px) scale(.92);opacity:0}}
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}36%{transform:scale(1.16)}48%{transform:scale(1)}}
  @keyframes lineIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>

    <p class="sub">七夕 · 为爱搭一座桥</p>

      <input id="meName" placeholder="你的名字" maxlength="8" value="猴子">
      <div class="heartJoin">❤</div>
      <input id="taName" placeholder="TA的名字" maxlength="8" value="emma">
    </div>

  </div>
</div>

  <div class="story kai">
    <p style="animation-delay:.2s">相传每年七月初七，</p>
    <p style="animation-delay:1.2s">天下喜鹊飞上天河，以身搭桥，</p>
    <p style="animation-delay:2.2s">让牛郎织女银河相会。</p>

    <div class="btnRow">
      <button id="againBtn" class="btn">再搭一次 💞</button>

    </div>
  </div>
</div>

const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

/* ============================ 画布与布局 ============================ */
let W = 0, H = 0, DPR = 1;
const L = {};               // 布局缓存（银河 / 桥位 / 相会点）

function slotPos(t) {
  // 鹊桥弧线：两端为银河两岸，向上拱起（t ∈ [0,1]，可为负/超1表示岸上）
  const bulge = Math.sin(Math.PI * t);
  return {
    x: lerp(L.bankA.x, L.bankB.x, t) + L.up.x * L.h * bulge,
    y: lerp(L.bankA.y, L.bankB.y, t) + L.up.y * L.h * bulge,
  };
}

function computeLayout() {
  const m = Math.min(W, H);
  L.scale = m;
  L.S = clamp(m / 800, 0.55, 1.2);                  // v2 全局缩放因子：所有固定像素尺寸 ×S
  L.Sp = clamp(L.S, 0.7, 1.15);                     // 微粒/描边缩放（下限抬高，避免过度缩小）
  L.portrait = H > W;                               // 竖屏标记
  L.swarm = L.portrait || m < CONFIG.SWARM_SHORT_SIDE;   // v7：移动端鸦群模式标记
  L.cx = W * 0.5;
  L.cy = H * 0.56;
  L.angle = -0.30;                                  // 银河走向（右向上）
  L.d = { x: Math.cos(L.angle), y: Math.sin(L.angle) };
  L.up = { x: L.d.y, y: -L.d.x };                   // 垂直于银河、指向画面上方
  L.R = m * 0.30;                                   // 岸距中心距离
  L.h = L.R * (L.portrait ? 0.62 : 0.52);           // 桥拱高度（竖屏加高，画面更饱满）
  // 月亮：竖屏缩小并上移避让标题与排行榜按钮；横屏维持右上原位
  L.moon = L.portrait
    ? { x: W * 0.86, y: H * 0.045, r: m * 0.040 }
    : { x: W * 0.84, y: H * 0.14, r: m * 0.055 };
  L.bankA = { x: L.cx + L.up.x * L.R, y: L.cy + L.up.y * L.R };   // 左上岸
  L.bankB = { x: L.cx - L.up.x * L.R, y: L.cy - L.up.y * L.R };   // 右下岸
  L.slots = [];
  for (let i = 0; i < CONFIG.NEED; i++) {
    L.slots.push(slotPos(CONFIG.NEED === 1 ? 0.5 : i / (CONFIG.NEED - 1)));
  }
  L.meet = slotPos(0.5);
}

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

}

function loverPos(lv) {
  const t = lerp(lv.t0, 0.5, easeInOut(clamp(lv.u, 0, 1)));
  const p = slotPos(t);
  p.y += Math.sin(tNow * 1.4 + lv.phase) * 3;
  return p;
}

/* ---------- 背景星星 / 银河星雾 / 流星 ---------- */
function buildStars() {
  stars.length = 0;
  const n = clamp(Math.round(W * H / 8500), 90, 240);
  const hues = ['255,255,255', '255,255,255', '255,255,255', '196,214,255', '255,224,238', '255,238,196'];
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.max(0.3, (0.4 + Math.random() * 1.3) * L.S),
      base: 0.35 + Math.random() * 0.6,
      ph: Math.random() * TAU,
      sp: 0.6 + Math.random() * 2.2,
      hue: pick(hues),
    });
  }
}

function buildMilkyDots() {
  milkyDots.length = 0;
  const bandHalf = Math.min(W, H) * 0.24;
  const len = Math.hypot(W, H) * 0.62;
  for (let i = 0; i < 420; i++) {
    const gauss = (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
    milkyDots.push({
      x: (Math.random() * 2 - 1) * len,
      y: gauss * bandHalf * 0.85,
      r: Math.max(0.25, (0.4 + Math.random() * 1.1) * L.S),
      a: 0.25 + Math.random() * 0.75,
      tw: Math.random() * TAU,
      ts: 0.5 + Math.random() * 1.5,
    });
  }
}

function updateShooting(dt) {
  shootNext -= dt;
  if (shootNext <= 0) {
    shootNext = 3.5 + Math.random() * 5;
    const downLeft = Math.random() < 0.5;
    const ang = (downLeft ? Math.PI * 0.75 : Math.PI * 0.25) + (Math.random() - 0.5) * 0.2;
    const sp = rand(750, 1200);
    shooting.push({
      x: W * rand(0.15, 0.85), y: H * rand(0.05, 0.35),
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      age: 0, life: rand(0.7, 1.1),
    });
  }
  for (let i = shooting.length - 1; i >= 0; i--) {
    const s = shooting[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.age += dt;
    if (s.age >= s.life) shooting.splice(i, 1);
  }
}

/* ---------- 喜鹊 ---------- */
function spawnMagpie() {
  const fromLeft = Math.random() < 0.5;
  // v3：提速 1.6~2.2 倍且每只随机，配合更大正弦扰动与偶发急转，轨迹更飘忽
  const speed = Math.max(95, W * 0.115) * rand(CONFIG.SPEED_MULT_MIN, CONFIG.SPEED_MULT_MAX);
  const baseY = H * rand(0.16, 0.58);
  magpies.push({
    state: 'flying',          // flying → toBridge → perched（fleeing 为被惊散）
    slot: -1,
    gold: false,
    x: fromLeft ? -60 : W + 60,
    baseY: baseY,
    y: 0,
    vx: fromLeft ? speed : -speed,
    dir: fromLeft ? 1 : -1,
    amp: rand(26, 60) * L.Sp,
    freq: rand(0.03, 0.07),
    phase: Math.random() * TAU,
    size: clamp(16 * L.S, 10.5, 19),
    wing: Math.random() * 6,
    wingSpd: rand(11, 15),
    rot: 0, perchT: 0, trailT: 0,
    dodgeT: 0, dodgeCd: 0, dodgeY: 0, dodgeVx: 0, dodgeVy: 0,
    dartNext: rand(1.2, 3.8),
    fleeVx: 0, fleeVy: 0,
  });
  // v7 鸦群模式：每次刷喜鹊伴随 2~4 只乌鸦走相似航线/相近速度（受同屏上限约束）
  if (L.swarm) {
    const room = CONFIG.SWARM_MAX_CROWS - crows.filter(c => !c.scared).length;
    const n = Math.min(Math.max(0, room), Math.round(rand(CONFIG.SWARM_ESCORT_MIN, CONFIG.SWARM_ESCORT_MAX)));
    for (let i = 0; i < n; i++) {
      spawnCrow({
        fromLeft: fromLeft,
        baseY: clamp(baseY + rand(-46, 46), H * 0.14, H * 0.62),
        speed: speed * rand(0.85, 1.12),   // 与喜鹊相近的速度
      });
    }
  }
}

function slotDrawPos(idx) {
  const p = L.slots[idx] || L.meet;   // 越界防御：异常槽位回退到相会点，避免读取 undefined 崩溃
  const waving = state !== 'collecting';
  const bob = Math.sin(tNow * 2.4 + idx * 0.65) * (waving ? 4.5 : 2.2) * L.Sp;
  return { x: p.x, y: p.y + bob };
}

/* 槽位动态管理（v3）：惊散会清空槽位并回退进度，槽位按"首个空位"分配避免冲突 */
function firstFreeSlot() {
  for (let i = 0; i < CONFIG.NEED; i++) {
    let taken = false;
    for (const m of magpies) {
      if (m.slot === i) { taken = true; break; }
    }
    if (!taken) return i;
  }
  return -1;
}

function syncCollected() {
  collected = 0;
  for (const m of magpies) {
    if (m.slot >= 0) collected++;
  }
}

function collectMagpie(mg) {
  // 双重防护：超过上限或非飞行状态一律不收集，杜绝 collected 越界
  if (collected >= CONFIG.NEED || mg.state !== 'flying') return false;
  const slot = firstFreeSlot();
  if (slot < 0) return false;
  mg.state = 'toBridge';
  mg.slot = slot;
  syncCollected();
  updateProgressUI();
  particles.push({ type: 'ring', x: mg.x, y: mg.y, age: 0, life: 0.55, color: '#ffb3cd' });
  spawnHearts(mg.x, mg.y, 6);
  return true;
}

/* v3：月老相助——召唤金色喜鹊从最近边缘直飞空桥位 */
function summonGoldMagpie() {
  const slot = firstFreeSlot();
  if (slot < 0) return false;
  const target = L.slots[slot];
  const fromLeft = target.x < W * 0.5;   // 从距槽位更近的一侧入场
  const sx = fromLeft ? -50 : W + 50;
  const sy = clamp(target.y + rand(-60, 60), 40, H - 60);
  magpies.push({
    state: 'toBridge', slot, gold: true,
    x: sx, y: sy, baseY: sy,
    vx: fromLeft ? 200 : -200,
    dir: fromLeft ? 1 : -1,
    amp: 0, freq: 0.01, phase: 0,
    size: clamp(16 * L.S, 10.5, 19),
    wing: 0, wingSpd: 15,
    rot: 0, perchT: 0, trailT: 0,
    dodgeT: 0, dodgeCd: 0, dodgeY: 0, dodgeVx: 0, dodgeVy: 0,
    dartNext: 1e9, fleeVx: 0, fleeVy: 0,
  });
  syncCollected();
  updateProgressUI();
  particles.push({ type: 'ring', x: sx, y: sy, age: 0, life: 0.6, color: '#ffd97a' });
  for (let i = 0; i < 8; i++) {
    particles.push({
      type: 'spark', x: sx, y: sy,
      vx: rand(-90, 90), vy: rand(-90, 30),
      age: 0, life: 0.7, size: 2.2 * L.Sp,
      color: pick(['#ffd97a', '#ffecb0', '#ffc94d']),
      g: 40, spin: 1, delay: rand(0, 0.15),
    });
  }
  return true;
}

function updateMagpies(dt) {
  for (let i = magpies.length - 1; i >= 0; i--) {
    const mg = magpies[i];
    if (mg.state === 'flying') {
      // v3：偶发急转（自发的飘忽机动，不消耗躲避冷却）
      mg.dartNext -= dt;
      if (mg.dartNext <= 0) {
        mg.dartNext = rand(1.2, 3.8);
        if (mg.dodgeT <= 0) {
          mg.dodgeT = 0.3;
          mg.dodgeVx = rand(-40, 40);
          mg.dodgeVy = (Math.random() < 0.5 ? -1 : 1) * rand(150, 260) * L.Sp;
        }
      }
      if (mg.dodgeT > 0) {
        // 受惊逃窜：沿远离点击方向加速，速度指数衰减
        mg.dodgeT -= dt;
        mg.x += (mg.vx + mg.dodgeVx) * dt;
        mg.dodgeY += mg.dodgeVy * dt;
        const dec = Math.exp(-2.5 * dt);
        mg.dodgeVx *= dec;
        mg.dodgeVy *= dec;
      } else {
        mg.x += mg.vx * dt;
        mg.dodgeY *= Math.exp(-3 * dt);   // 缓慢回归原轨迹
      }
      if (mg.dodgeCd > 0) mg.dodgeCd = Math.max(0, mg.dodgeCd - dt);
      mg.wing += mg.wingSpd * dt;
      let ny = mg.baseY + Math.sin(mg.x * mg.freq + mg.phase) * mg.amp + mg.dodgeY;
      if (ny < 14 || ny > H - 14) {      // 上下边界：把偏移拉回，贴边掠过不出画
        mg.dodgeY += clamp(ny, 14, H - 14) - ny;
        ny = clamp(ny, 14, H - 14);
      }
      mg.y = ny;
      mg.rot = clamp(Math.cos(mg.x * mg.freq + mg.phase) * mg.amp * mg.freq, -0.45, 0.45);
      if (mg.x < -160 || mg.x > W + 160) magpies.splice(i, 1);
    } else if (mg.state === 'fleeing') {
      // v3：被乌鸦惊散——振翅高飞离场
      mg.x += mg.fleeVx * dt;
      mg.y += mg.fleeVy * dt;
      mg.wing += 20 * dt;
      mg.rot = clamp(Math.atan2(mg.fleeVy, Math.abs(mg.fleeVx)) * 0.5, -0.6, 0.6);
      if (mg.y < -100 || mg.x < -160 || mg.x > W + 160) magpies.splice(i, 1);
    } else if (mg.state === 'toBridge') {
      const target = slotDrawPos(mg.slot);
      const dx = target.x - mg.x, dy = target.y - mg.y;
      const dist = Math.hypot(dx, dy);
      const spd = Math.min(700, 240 + dist * 2.2);
      const step = Math.min(dist, spd * dt);
      if (dist > 0.001) { mg.x += dx / dist * step; mg.y += dy / dist * step; }
      mg.dir = dx >= 0 ? 1 : -1;
      mg.rot = clamp(Math.atan2(dy, Math.abs(dx)) * 0.7, -0.5, 0.5);
      mg.wing += 16 * dt;
      mg.trailT -= dt;
      if (mg.trailT <= 0) {
        mg.trailT = 0.05;
        particles.push({ type: 'spark', x: mg.x, y: mg.y, vx: rand(-10, 10), vy: 14, age: 0, life: 0.5, size: 1.6 * L.Sp, color: mg.gold ? '#ffd97a' : '#ffe6b0', g: 0, spin: 1 });
      }
      if (dist < 5) { mg.state = 'perched'; mg.perchT = 0; }
    } else { // perched：停在桥位上，随桥起伏
      mg.perchT += dt;
      const p = slotDrawPos(mg.slot);
      mg.x = p.x; mg.y = p.y;
      const tParam = mg.slot / (CONFIG.NEED - 1);
      mg.dir = tParam < 0.5 ? 1 : -1;
      const tanx = (L.bankB.x - L.bankA.x) + L.up.x * L.h * Math.PI * Math.cos(Math.PI * tParam);
      const tany = (L.bankB.y - L.bankA.y) + L.up.y * L.h * Math.PI * Math.cos(Math.PI * tParam);
      mg.rot = clamp(Math.atan2(tany, Math.abs(tanx)) * 0.5, -0.45, 0.45);
      mg.wing += 3.2 * dt;
    }
  }
}

/* ---------- 乌鸦干扰（v3；v7 支持伴飞参数） ---------- */
function spawnCrow(opts) {
  const o = opts || {};
  const fromLeft = o.fromLeft !== undefined ? o.fromLeft : Math.random() < 0.5;
  const speed = o.speed !== undefined ? o.speed : Math.max(95, W * 0.115) * rand(1.3, 1.8);
  crows.push({
    x: fromLeft ? -60 : W + 60,
    baseY: o.baseY !== undefined ? o.baseY : H * rand(0.2, 0.55),
    y: 0,
    vx: fromLeft ? speed : -speed,
    dir: fromLeft ? 1 : -1,
    amp: rand(18, 40) * L.Sp,
    freq: rand(0.02, 0.04),
    phase: Math.random() * TAU,
    size: clamp(17 * L.S, 11, 20),      // 比喜鹊略大
    wing: Math.random() * 6,
    wingSpd: rand(10, 13),
    rot: 0,
    screechT: 0,                        // 嘶鸣抖动动画剩余时间
    scared: false,                      // 被点中后加速离场
  });
}

function updateCrows(dt) {
  for (let i = crows.length - 1; i >= 0; i--) {
    const c = crows[i];
    if (c.scared) {
      c.x += c.vx * 2.2 * dt;
      c.y -= 150 * dt;
      c.wing += 24 * dt;
    } else {
      c.x += c.vx * dt;
      c.y = c.baseY + Math.sin(c.x * c.freq + c.phase) * c.amp;
      c.rot = clamp(Math.cos(c.x * c.freq + c.phase) * c.amp * c.freq, -0.45, 0.45);
      c.wing += c.wingSpd * dt;
    }
    if (c.screechT > 0) c.screechT -= dt;
    if (c.x < -160 || c.x > W + 160 || c.y < -140) crows.splice(i, 1);
  }
}

/* 误点乌鸦：警示反馈 + 惊散一只已落位喜鹊（进度 -1，桥上无喜鹊则不扣） */
function crowScare(c) {
  c.screechT = 0.55;
  c.scared = true;
  // 红色警示涟漪（双圈错开）
  particles.push({ type: 'ring', x: c.x, y: c.y, age: 0, life: 0.6, color: '#ff5252' });
  particles.push({ type: 'ring', x: c.x, y: c.y, age: 0, life: 0.6, color: '#ff7b7b', delay: 0.12 });
  for (let i = 0; i < 6; i++) {
    particles.push({
      type: 'spark', x: c.x, y: c.y,
      vx: rand(-80, 80), vy: rand(-60, 40),
      age: 0, life: 0.5, size: 2 * L.Sp,
      color: pick(['#ff5252', '#ff7b7b', '#ffb3b3']),
      g: 30, spin: 1,
    });
  }
  // 惊散最近落位（取槽位号最大的一只）的喜鹊
  let victim = null;
  for (const m of magpies) {
    if (m.state === 'perched' && m.slot >= 0 && m.slot < CONFIG.NEED) {
      if (!victim || m.slot > victim.slot) victim = m;
    }
  }
  if (victim) {
    victim.state = 'fleeing';
    victim.slot = -1;                   // 立即释放槽位
    victim.fleeVx = (Math.random() < 0.5 ? -1 : 1) * rand(120, 240);
    victim.fleeVy = -rand(260, 400);
    syncCollected();
    updateProgressUI();                 // 进度与圆点回退
  }
}

/* ---------- 粒子 / 涟漪 ---------- */
function spawnHearts(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      type: 'heart',
      x: x + rand(-16, 16), y: y + rand(-10, 10),
      vx: rand(-16, 16), vy: -rand(30, 72),
      age: 0, life: rand(1.3, 2.0),
      size: rand(5, 10) * L.Sp, phase: Math.random() * TAU,
      color: pick(['#ff8fab', '#ff5d8f', '#ffb3cd', '#ffd166']),
    });
  }
}

function spawnRipple(x, y) {
  ripples.push({ x, y, age: 0 });
  spawnHearts(x, y, 4);
}

function spawnBurst(x, y) {
  const palettes = [
    ['#ff5d8f', '#ff8fab', '#ffd166'],
    ['#ff4d6d', '#ff9ebb', '#ffe3a0'],
    ['#c084fc', '#ff8fab', '#9be7ff'],
    ['#7bdff2', '#b8f2e6', '#ffd166'],
  ];
  const colors = pick(palettes);
  particles.push({ type: 'flash', x, y, age: 0, life: 0.35, size: rand(56, 96) * L.Sp });
  const N = 26;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * TAU + Math.random() * 0.08;
    const hx = 16 * Math.pow(Math.sin(a), 3);
    const hy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
    const k = Math.min(W, H) * 0.014 * rand(0.85, 1.15);
    particles.push({
      type: 'spark', x, y,
      vx: hx * k, vy: hy * k,
      age: 0, life: rand(1.3, 1.9),
      size: rand(1.8, 3.4) * L.Sp,
      color: colors[i % colors.length],
      g: 26, spin: Math.random() < 0.5 ? -1 : 1,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.delay > 0) { p.delay -= dt; continue; }   // v3：延迟出场的粒子（警示双圈错开）
    p.age += dt;
    if (p.age >= p.life) { particles.splice(i, 1); continue; }
    if (p.type === 'spark') {
      p.vy += (p.g || 0) * dt;
      const drag = Math.exp(-1.05 * dt);
      p.vx *= drag; p.vy *= drag;
      p.x += p.vx * dt; p.y += p.vy * dt;
    } else if (p.type === 'heart') {
      p.vy -= 14 * dt;
      p.x += Math.sin(p.age * 2.6 + p.phase) * 22 * dt + p.vx * dt;
      p.y += p.vy * dt;
    }
  }
  if (particles.length > 520) particles.splice(0, particles.length - 520);
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].age += dt;
    if (ripples[i].age > 1.45) ripples.splice(i, 1);
  }
}

/* ---------- 本地排行榜（v4，localStorage 容错） ---------- */
function loadBoard() {
  try {
    const raw = window.localStorage.getItem(CONFIG.LB_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    return arr.filter(r => r && typeof r.clicks === 'number' && isFinite(r.clicks) &&
      typeof r.ms === 'number' && isFinite(r.ms) &&
      typeof r.hints === 'number' && typeof r.ts === 'number' &&
      !(r.hints > 0));   // v5：提示成绩不上榜（读取时顺带过滤旧版数据中的提示记录）
  } catch (err) {
    return [];   // 隐私模式 / 数据损坏：静默降级为空榜，不影响游戏
  }
}

function saveBoard(arr) {
  try {
    window.localStorage.setItem(CONFIG.LB_KEY, JSON.stringify(arr));
  } catch (err) { /* 写入失败（隐私模式等）不影响游戏 */ }
}

/* 排名规则（v5：榜内只存无提示成绩）：点击数升序 → 耗时升序 */
function boardCompare(a, b) {
  if (a.clicks !== b.clicks) return a.clicks - b.clicks;
  return a.ms - b.ms;
}

function addRecord(rec) {
  const arr = loadBoard();
  arr.push(rec);
  arr.sort(boardCompare);
  if (arr.length > CONFIG.LB_MAX) arr.length = CONFIG.LB_MAX;
  saveBoard(arr);
  const idx = arr.indexOf(rec);
  return idx >= 0 ? idx + 1 : -1;   // -1 = 超出 50 名被截断
}

function fmtMs(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}

function runMs() {
  return runStartT >= 0 ? Math.max(0, Math.round((tNow - runStartT) * 1000)) : 0;
}

function updateScoreLine() {
  if (!lastRun) { scoreLineEl.textContent = ''; return; }
  const base = '本次成绩：' + lastRun.clicks + ' 次点击 · ' + (lastRun.ms / 1000).toFixed(1) + ' 秒 · ';
  if (lastRun.hints > 0) {
    // v5：使用过月老相助——显示成绩但不计名次
    scoreLineEl.textContent = base + '本次使用了月老相助，成绩不计入排行榜 🌙';
    return;
  }
  const rankTxt = lastRun.rank > 0 ? '第 ' + lastRun.rank + ' 名 🎉' : '未上榜';
  scoreLineEl.textContent = base + rankTxt;
}

function renderBoard() {
  while (boardListEl.firstChild) boardListEl.removeChild(boardListEl.firstChild);
  const arr = loadBoard();
  if (arr.length === 0) {
    const p = document.createElement('p');
    p.className = 'board-empty';
    p.textContent = '还没有通关记录，快来抢沙发 💕';
    boardListEl.appendChild(p);
    return;
  }
  const top = arr.slice(0, 10);
  for (let i = 0; i < top.length; i++) {
    const r = top[i];
    const row = document.createElement('div');
    row.className = 'board-row';
    const d = new Date(r.ts);
    row.textContent = (i + 1) + '.  ' + r.clicks + ' 次 · ' + fmtMs(r.ms) +
      ' · ' + (d.getMonth() + 1) + '/' + d.getDate();   // v5：榜内均为无提示成绩，不再有 🌙 列
    boardListEl.appendChild(row);
  }
}

/* ---------- 流程控制 ---------- */
function updateProgressUI() {
  const shown = Math.min(collected, CONFIG.NEED);   // 显示层钳制，任何时序下都不会出现 "8 / 7"
  progressTextEl.textContent = CONFIG.PROGRESS_LABEL + ' ' + shown + ' / ' + CONFIG.NEED;
  for (let i = 0; i < dotEls.length; i++) {
    dotEls[i].classList.toggle('on', i < shown);
  }
}

function startMeeting() {
  state = 'meeting';
  stateT = 0;
  progressEl.classList.add('hidden');
}

function fireMeet() {
  meetFired = true;
  bigHeartT = 0;
  flash = 0.5;
  burstQueue = [
    { at: 0.05, x: L.meet.x, y: L.meet.y - 8 },
    { at: 0.42, x: L.meet.x + L.scale * 0.10, y: L.meet.y - L.scale * 0.06 },
    { at: 0.80, x: L.meet.x - L.scale * 0.11, y: L.meet.y - L.scale * 0.04 },
    { at: 1.25, x: L.meet.x + L.scale * 0.04, y: L.meet.y - L.scale * 0.12 },
    { at: 1.70, x: L.meet.x - L.scale * 0.05, y: L.meet.y - L.scale * 0.11 },
    { at: 2.20, x: L.meet.x, y: L.meet.y - L.scale * 0.16 },
  ];
}

function resetGame() {
  magpies.length = 0;
  crows.length = 0;          // v3
  particles.length = 0;
  ripples.length = 0;
  collected = 0;
  bridgeFormT = 0;
  meetFired = false;
  bigHeartT = -1;
  flash = 0;
  burstQueue = [];
  crowArmed = false;         // v3
  crowNext = 0;              // v3
  hintCd = 0;                // v3：月老相助恢复可用
  hintBtn.disabled = false;
  hintBtn.classList.remove('hide');
  runClicks = 0;             // v4：本局计数/计时清零（排行榜数据保留）
  runStartT = -1;
  runHints = 0;
  lastRun = null;
  updateScoreLine();
  loveL.u = 0;
  loveR.u = 0;
  state = 'collecting';
  stateT = 0;
  spawnCd = 0.8;
  letterEl.classList.remove('show');
  progressEl.classList.remove('hidden');
  updateProgressUI();
}

/* ============================ 更新 ============================ */
function update(dt) {
  tNow += dt;
  stateT += dt;

  if (!progressShown && tNow > 0.6) {
    progressShown = true;
    progressEl.classList.add('show');
    updateProgressUI();
  }

  updateShooting(dt);

  // 收集阶段：补充喜鹊、判断桥是否成形
  if (state === 'collecting') {
    spawnCd -= dt;
    let flyingCount = 0;
    for (const mg of magpies) if (mg.state === 'flying') flyingCount++;
    if (collected < CONFIG.NEED && flyingCount < 2 && spawnCd <= 0) {
      spawnMagpie();
      spawnCd = rand(1.0, 2.2);
    }
    // v3/v4/v7 乌鸦干扰：开局即出现；间隔与上限区分常规/鸦群模式
    const crowCap = L.swarm ? CONFIG.SWARM_MAX_CROWS : CONFIG.CROW_MAX;
    const gapMin = L.swarm ? CONFIG.SWARM_MIN_GAP : CONFIG.CROW_MIN_GAP;
    const gapMax = L.swarm ? CONFIG.SWARM_MAX_GAP : CONFIG.CROW_MAX_GAP;
    if (!crowArmed && collected >= CONFIG.CROW_AFTER) {
      crowArmed = true;
      crowNext = rand(gapMin, gapMax);
    }
    if (crowArmed) {
      crowNext -= dt;
      if (crowNext <= 0) {
        if (crows.filter(c => !c.scared).length < crowCap) spawnCrow();
        crowNext = crows.some(c => !c.scared)
          ? rand(gapMin, gapMax)
          : 1;
      }
    }
    // 桥是否成形：以「7 个桥槽实际被落位喜鹊占据」为准（>= 判定，与计数器解耦），
    // 即使出现极端点击时序也不会软锁
    let perchedOnBridge = 0;
    for (const m of magpies) {
      if (m.state === 'perched' && m.slot >= 0 && m.slot < CONFIG.NEED) perchedOnBridge++;
    }
    if (perchedOnBridge >= CONFIG.NEED) {
      bridgeFormT += dt;
      if (bridgeFormT >= 0.9) startMeeting();
    } else {
      bridgeFormT = 0;
    }
  }

  updateMagpies(dt);
  updateCrows(dt);

  // v3：「月老相助」冷却与可见性（相会开始后隐藏，重置后恢复）
  if (hintCd > 0) hintCd = Math.max(0, hintCd - dt);
  hintBtn.disabled = !(state === 'collecting' && hintCd <= 0 && collected < CONFIG.NEED);
  hintBtn.classList.toggle('hide', state !== 'collecting');

  // 相会阶段
  if (state === 'meeting') {
    const u = easeInOut(clamp(stateT / MEET_DUR, 0, 1));
    loveL.u = u;
    loveR.u = u;
    trailCd -= dt;
    if (trailCd <= 0 && !meetFired) {
      trailCd = 0.05;
      for (const lv of [loveL, loveR]) {
        const p = loverPos(lv);
        particles.push({ type: 'spark', x: p.x, y: p.y, vx: rand(-6, 6), vy: rand(-6, 6), age: 0, life: 0.6, size: 1.5 * L.Sp, color: lv.spark, g: 0, spin: 1 });
      }
    }
    if (stateT >= MEET_DUR && !meetFired) fireMeet();
    if (meetFired) {
      for (let i = burstQueue.length - 1; i >= 0; i--) {
        if (stateT >= MEET_DUR + burstQueue[i].at) {
          spawnBurst(burstQueue[i].x, burstQueue[i].y);
          burstQueue.splice(i, 1);
        }
      }
      if (stateT >= MEET_DUR + LETTER_DELAY) {
        state = 'letter';
        letterEl.classList.add('show');
        // v4/v5：通关——计时止于此刻；使用过月老相助（hints>0）的成绩不写入排行榜
        const rec = { clicks: runClicks, ms: runMs(), hints: runHints, ts: Date.now() };
        const rank = rec.hints > 0 ? -1 : addRecord(rec);
        lastRun = { clicks: rec.clicks, ms: rec.ms, hints: rec.hints, ts: rec.ts, rank: rank };
        updateScoreLine();
        gentleCd = 0.5;
      }
    }
  } else if (state === 'letter') {
    gentleCd -= dt;
    if (gentleCd <= 0) {
      gentleCd = 1.4;
      spawnHearts(L.meet.x + rand(-L.scale * 0.1, L.scale * 0.1), L.meet.y + rand(0, L.scale * 0.05), 2);
    }
  }

  if (bigHeartT >= 0) bigHeartT += dt;
  flash = Math.max(0, flash - dt * 0.9);
  updateParticles(dt);
}

/* ============================ 绘制 ============================ */
function drawHeartPath(g) {
  g.beginPath();
  g.moveTo(0, 0.32);
  g.bezierCurveTo(-0.55, -0.02, -0.36, -0.44, 0, -0.18);
  g.bezierCurveTo(0.36, -0.44, 0.55, -0.02, 0, 0.32);
  g.closePath();
}

function drawHeartAt(g, x, y, s, rot, fill, alpha, stroke, lw) {
  g.save();
  g.translate(x, y);
  g.rotate(rot || 0);
  g.scale(s, s);
  g.globalAlpha = clamp(alpha, 0, 1);
  drawHeartPath(g);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = (lw || 2) / s; g.stroke(); }
  g.restore();
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0c26');
  g.addColorStop(0.45, '#141a44');
  g.addColorStop(0.75, '#2a1e56');
  g.addColorStop(1, '#3b2160');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawStars() {
  for (const s of stars) {
    const a = s.base * (0.45 + 0.55 * Math.sin(tNow * s.sp + s.ph));
    ctx.fillStyle = 'rgba(' + s.hue + ',' + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
    if (s.r > 1.25) {
      ctx.strokeStyle = 'rgba(' + s.hue + ',' + (a * 0.5).toFixed(3) + ')';
      ctx.lineWidth = 0.7;
      const l = s.r * 3.4;
      ctx.beginPath();
      ctx.moveTo(s.x - l, s.y); ctx.lineTo(s.x + l, s.y);
      ctx.moveTo(s.x, s.y - l); ctx.lineTo(s.x, s.y + l);
      ctx.stroke();
    }
  }
}

function drawMilkyWay() {
  const bandHalf = Math.min(W, H) * 0.24;
  const len = Math.hypot(W, H) * 0.62;
  ctx.save();
  ctx.translate(L.cx, L.cy);
  ctx.rotate(L.angle);
  const g = ctx.createLinearGradient(0, -bandHalf, 0, bandHalf);
  g.addColorStop(0, 'rgba(170,185,255,0)');
  g.addColorStop(0.3, 'rgba(180,195,255,0.075)');
  g.addColorStop(0.5, 'rgba(228,232,255,0.16)');
  g.addColorStop(0.7, 'rgba(180,195,255,0.075)');
  g.addColorStop(1, 'rgba(170,185,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(-len, -bandHalf, len * 2, bandHalf * 2);
  // 星云色斑
  const nebulas = [
    { x: -len * 0.4, y: 0, r: bandHalf * 0.9, c: 'rgba(255,170,210,0.05)' },
    { x: 0, y: bandHalf * 0.1, r: bandHalf * 1.1, c: 'rgba(150,190,255,0.06)' },
    { x: len * 0.45, y: -bandHalf * 0.2, r: bandHalf * 0.8, c: 'rgba(190,160,255,0.05)' },
  ];
  for (const nb of nebulas) {
    const ng = ctx.createRadialGradient(nb.x, nb.y, 0, nb.x, nb.y, nb.r);
    ng.addColorStop(0, nb.c);
    ng.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ng;
    ctx.beginPath();
    ctx.arc(nb.x, nb.y, nb.r, 0, TAU);
    ctx.fill();
  }
  // 密集星雾亮点
  ctx.fillStyle = '#e8ecff';
  for (const d of milkyDots) {
    const tw = 0.55 + 0.45 * Math.sin(tNow * d.ts + d.tw);
    ctx.globalAlpha = d.a * tw * 0.8;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawMoon() {
  const mx = L.moon.x, my = L.moon.y, r = L.moon.r;   // 位置/大小由布局按横竖屏计算
  const halo = ctx.createRadialGradient(mx, my, r * 0.5, mx, my, r * 3.2);
  halo.addColorStop(0, 'rgba(255,244,214,0.32)');
  halo.addColorStop(0.5, 'rgba(255,236,200,0.10)');
  halo.addColorStop(1, 'rgba(255,236,200,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(mx, my, r * 3.2, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#f6ecc8';
  ctx.beginPath();
  ctx.arc(mx, my, r, 0, TAU);
  ctx.fill();
  // 明暗界线（凸月质感）
  ctx.save();
  ctx.beginPath();
  ctx.arc(mx, my, r, 0, TAU);
  ctx.clip();
  const sh = ctx.createRadialGradient(mx - r * 0.9, my - r * 0.4, r * 0.1, mx - r * 0.9, my - r * 0.4, r * 2.0);
  sh.addColorStop(0, 'rgba(60,58,110,0)');
  sh.addColorStop(0.55, 'rgba(60,58,110,0)');
  sh.addColorStop(1, 'rgba(50,48,100,0.5)');
  ctx.fillStyle = sh;
  ctx.fillRect(mx - r, my - r, r * 2, r * 2);
  ctx.fillStyle = 'rgba(190,175,140,0.45)';
  const craters = [[-0.25, -0.1, 0.16], [0.3, 0.25, 0.11], [0.05, -0.42, 0.09], [-0.4, 0.3, 0.08]];
  for (const c of craters) {
    ctx.beginPath();
    ctx.arc(mx + c[0] * r, my + c[1] * r, c[2] * r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawShooting() {
  for (const s of shooting) {
    const a = Math.sin(Math.PI * clamp(s.age / s.life, 0, 1));
    const sp = Math.hypot(s.vx, s.vy) || 1;
    const nx = s.vx / sp, ny = s.vy / sp;
    const len = (90 + 60 * a) * L.Sp;
    const g = ctx.createLinearGradient(s.x, s.y, s.x - nx * len, s.y - ny * len);
    g.addColorStop(0, 'rgba(255,255,255,' + (0.9 * a).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.8 * L.Sp;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - nx * len, s.y - ny * len);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, 1.8 * L.Sp, 0, TAU);
    ctx.fill();
  }
}

function strokeBridgePath() {
  ctx.beginPath();
  const N = 24;
  for (let i = 0; i <= N; i++) {
    const p = slotPos(i / N);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
}

function drawBridge() {
  if (state === 'collecting' && collected < CONFIG.NEED) {
    // 未成形：微弱的星尘虚线提示桥位
    ctx.save();
    ctx.setLineDash([2 * L.S, 14 * L.S]);
    ctx.strokeStyle = 'rgba(255,220,235,0.10)';
    ctx.lineWidth = 1.5 * L.Sp;
    strokeBridgePath();
    ctx.stroke();
    ctx.restore();
    return;
  }
  const glow = state === 'collecting' ? clamp(bridgeFormT / 0.9, 0, 1) : 1;
  if (glow <= 0) return;
  const grad = ctx.createLinearGradient(L.bankA.x, L.bankA.y, L.bankB.x, L.bankB.y);
  grad.addColorStop(0, '#ffd166');
  grad.addColorStop(0.5, '#ff8fab');
  grad.addColorStop(1, '#c084fc');
  ctx.save();
  ctx.lineCap = 'round';
  // 柔光层
  ctx.globalAlpha = 0.2 * glow;
  ctx.strokeStyle = grad;
  ctx.lineWidth = 10 * L.Sp;
  strokeBridgePath();
  ctx.stroke();
  // 亮芯层
  ctx.globalAlpha = 0.85 * glow;
  ctx.lineWidth = 3 * L.Sp;
  ctx.shadowColor = 'rgba(255,140,180,0.8)';
  ctx.shadowBlur = 12 * L.Sp;
  strokeBridgePath();
  ctx.stroke();
  ctx.restore();
}

function drawWing(g, flap, color, dy) {
  g.save();
  g.translate(-0.05, dy);
  g.rotate(-flap);
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(0, 0);
  g.quadraticCurveTo(-0.5, -0.55, -1.05, -0.42);
  g.quadraticCurveTo(-0.6, -0.1, -0.15, 0.08);
  g.closePath();
  g.fill();
  g.restore();
}

/* v3：鸟形绘制统一为调色板驱动——喜鹊 / 金色喜鹊 / 乌鸦共用一套路径 */
const MAGPIE_PALETTE = {
  body: '#3a4472', rim: 'rgba(255,255,255,0.22)', belly: '#f2f4ff',
  beak: '#f2a93b', wingFar: '#232b52', wingNear: '#4a5588', tail: '#333c68',
  eyeWhite: '#fff', eye: '#10142a', eyeGlow: false,
  auraFly: 'rgba(150,180,255,0.18)', auraSit: 'rgba(255,190,140,0.16)',
};
const GOLD_PALETTE = {
  body: '#d9a441', rim: 'rgba(255,248,225,0.5)', belly: '#ffe9b0',
  beak: '#8a5a2b', wingFar: '#b8862f', wingNear: '#f0c05e', tail: '#a3752a',
  eyeWhite: '#fff8e0', eye: '#3a2508', eyeGlow: false,
  auraFly: 'rgba(255,215,120,0.28)', auraSit: 'rgba(255,215,120,0.24)',
};
const CROW_PALETTE = {
  body: '#16161f', rim: 'rgba(255,70,70,0.28)', belly: null,
  beak: '#5a5a66', wingFar: '#0c0c13', wingNear: '#20202c', tail: '#101018',
  eyeWhite: null, eye: '#ff3b3b', eyeGlow: true,
  auraFly: 'rgba(255,60,60,0.12)', auraSit: 'rgba(255,60,60,0.12)',
};

function drawBird(x, y, size, dir, rot, flap, pal, auraColor, screechT) {
  // 柔和光晕，保证深空背景下清晰可见
  const auraR = size * 2.6;
  const aura = ctx.createRadialGradient(x, y, 1, x, y, auraR);
  aura.addColorStop(0, auraColor);
  aura.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = aura;
  ctx.beginPath();
  ctx.arc(x, y, auraR, 0, TAU);
  ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(dir * size, size);
  // 长尾
  ctx.fillStyle = pal.tail;
  ctx.beginPath();
  ctx.moveTo(-0.5, -0.05);
  ctx.lineTo(-1.7, -0.36);
  ctx.lineTo(-1.72, 0.1);
  ctx.closePath();
  ctx.fill();
  // 身体
  ctx.fillStyle = pal.body;
  ctx.beginPath();
  ctx.ellipse(0, 0, 0.62, 0.35, -0.12, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = pal.rim;
  ctx.lineWidth = 0.04;
  ctx.stroke();
  // 白肚（乌鸦没有）
  if (pal.belly) {
    ctx.fillStyle = pal.belly;
    ctx.beginPath();
    ctx.ellipse(0.02, 0.13, 0.4, 0.18, -0.08, 0, TAU);
    ctx.fill();
  }
  // 头
  ctx.fillStyle = pal.body;
  ctx.beginPath();
  ctx.arc(0.58, -0.16, 0.21, 0, TAU);
  ctx.fill();
  // 喙（受惊嘶鸣时张开）
  const open = screechT > 0 ? 0.14 : 0;
  ctx.fillStyle = pal.beak;
  ctx.beginPath();
  ctx.moveTo(0.74, -0.2 - open);
  ctx.lineTo(0.99 + open, -0.13 - open * 1.5);
  ctx.lineTo(0.74, -0.05 + open);
  ctx.closePath();
  ctx.fill();
  // 眼（乌鸦红眼发光）
  if (pal.eyeGlow) {
    ctx.save();
    ctx.shadowColor = '#ff3b3b';
    ctx.shadowBlur = 6;
    ctx.fillStyle = pal.eye;
    ctx.beginPath();
    ctx.arc(0.62, -0.21, screechT > 0 ? 0.08 : 0.055, 0, TAU);
    ctx.fill();
    ctx.restore();
  } else {
    ctx.fillStyle = pal.eyeWhite;
    ctx.beginPath();
    ctx.arc(0.62, -0.21, 0.05, 0, TAU);
    ctx.fill();
    ctx.fillStyle = pal.eye;
    ctx.beginPath();
    ctx.arc(0.635, -0.21, 0.024, 0, TAU);
    ctx.fill();
  }
  // 双翼
  drawWing(ctx, flap * 0.85 + 0.08, pal.wingFar, -0.12);
  drawWing(ctx, flap, pal.wingNear, 0.02);
  ctx.restore();
}

function drawMagpie(mg) {
  const flying = mg.state !== 'perched';
  const pal = mg.gold ? GOLD_PALETTE : MAGPIE_PALETTE;
  const flap = flying ? Math.sin(mg.wing) * 0.85 : 0.14 + Math.sin(mg.wing) * 0.05;
  drawBird(mg.x, mg.y, mg.size, mg.dir, mg.rot, flap, pal, flying ? pal.auraFly : pal.auraSit, 0);
}

function drawCrow(c) {
  // 嘶鸣抖动：受惊后半秒高频左右颤动，喙张开、红眼发亮
  const shake = c.screechT > 0 ? Math.sin(c.screechT * 55) * 3 : 0;
  const flap = Math.sin(c.wing) * (c.scared ? 0.95 : 0.85);
  drawBird(c.x + shake, c.y, c.size, c.dir, c.rot, flap, CROW_PALETTE, CROW_PALETTE.auraFly, c.screechT);
}

function drawLover(lv) {
  const p = loverPos(lv);
  const r = Math.max(3.5, L.scale * 0.009 * Math.max(L.S, 0.8));
  const pulse = 1 + Math.sin(tNow * 2 + lv.phase) * 0.15;
  const gl = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 6);
  gl.addColorStop(0, 'rgba(' + lv.rgb + ',0.55)');
  gl.addColorStop(0.4, 'rgba(' + lv.rgb + ',0.18)');
  gl.addColorStop(1, 'rgba(' + lv.rgb + ',0)');
  ctx.fillStyle = gl;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r * 6, 0, TAU);
  ctx.fill();
  // 星核 + 十字光芒
  ctx.strokeStyle = 'rgba(' + lv.rgb + ',0.8)';
  ctx.lineWidth = 1.2;
  const l = r * 4.5 * pulse;
  ctx.beginPath();
  ctx.moveTo(p.x - l, p.y); ctx.lineTo(p.x + l, p.y);
  ctx.moveTo(p.x, p.y - l); ctx.lineTo(p.x, p.y + l);
  const d = l * 0.5;
  ctx.moveTo(p.x - d * 0.7, p.y - d * 0.7); ctx.lineTo(p.x + d * 0.7, p.y + d * 0.7);
  ctx.moveTo(p.x + d * 0.7, p.y - d * 0.7); ctx.lineTo(p.x - d * 0.7, p.y + d * 0.7);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, TAU);
  ctx.fill();
  ctx.fillStyle = lv.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r * 0.55, 0, TAU);
  ctx.fill();
  // 名字标签
  ctx.font = '600 ' + Math.max(10, Math.round(L.scale * 0.024 * L.S)) + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = 5;
  ctx.fillStyle = 'rgba(255,238,246,0.92)';
  ctx.fillText(lv.name, p.x, p.y + r * 5.2 + 12);
  ctx.shadowBlur = 0;
}

function drawParticles() {
  for (const p of particles) {
    if (p.delay > 0) continue;
    const k = clamp(1 - p.age / p.life, 0, 1);
    if (p.type === 'spark') {
      drawHeartAt(ctx, p.x, p.y, p.size * 2.2, p.age * 2 * (p.spin || 1), p.color, k * 0.95);
    } else if (p.type === 'heart') {
      drawHeartAt(ctx, p.x, p.y, p.size, Math.sin(p.age * 2 + p.phase) * 0.25, p.color, k * 0.9);
    } else if (p.type === 'ring') {
      ctx.strokeStyle = p.color;
      ctx.globalAlpha = k * 0.85;
      ctx.lineWidth = 2.5 * L.Sp;
      ctx.beginPath();
      ctx.arc(p.x, p.y, (6 + (1 - k) * 32) * L.Sp, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (p.type === 'flash') {
      ctx.globalAlpha = k * 0.45;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.3 + 0.7 * (1 - k)), 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

function drawRipples() {
  for (const r of ripples) {
    for (let j = 0; j < 3; j++) {
      const t = r.age - j * 0.13;
      if (t <= 0.02 || t >= 1) continue;
      const s = Math.min(W, H) * 0.045 * (0.3 + t * 1.6);
      drawHeartAt(ctx, r.x, r.y, s, 0, null, (1 - t) * 0.55, '#ff96be', 2 * L.Sp);
    }
  }
}

function drawBigHeart() {
  if (bigHeartT < 0) return;
  const pop = easeOutBack(clamp(bigHeartT / 0.55, 0, 1));
  const pulse = 1 + 0.05 * Math.sin(tNow * 3.4);
  const s = L.scale * (L.portrait ? 0.085 : 0.075) * pop * pulse;   // 竖屏大爱心略放大
  if (s <= 0) return;
  const mx = L.meet.x, my = L.meet.y - s * 0.1;
  const gl = ctx.createRadialGradient(mx, my, 0, mx, my, s * 2.4);
  gl.addColorStop(0, 'rgba(255,120,170,0.38)');
  gl.addColorStop(1, 'rgba(255,120,170,0)');
  ctx.fillStyle = gl;
  ctx.beginPath();
  ctx.arc(mx, my, s * 2.4, 0, TAU);
  ctx.fill();

   鹊桥相会 · 七夕互动小游戏（单文件 / 触屏适配 / 无外部依赖）

/* ---------------- 基础与工具 ---------------- */

/* ---------------- 音效（WebAudio 本地合成，无音频文件） ---------------- */
const AU = {
  ctx:null, master:null, muted:false,
  init(){
    if(this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    try{
      this.ctx = new C();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : .5;
      this.master.connect(this.ctx.destination);

  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.value = m?0:.5; },
  tone(f, dur, type, vol, delay, slideTo){
    dur=dur||.3; type=type||'sine'; vol=vol||.25; delay=delay||0;
    if(!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0);
    if(slideTo>0) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);

    o.start(t0); o.stop(t0+dur+.05);
  },
  noise(dur, vol, fc, delay){

  pent:[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98,1760],
  chime(step){

  collect(){ this.tone(1318.5,.12,'sine',.2); this.tone(1760,.2,'sine',.16,.07); },
  pop(){ this.noise(.12,.16,1600); },
  fail(){ this.tone(320,.4,'sawtooth',.12,0,110); },
  fanfare(){

  meetChord(){

function drawAvatar(k,x,y,s,facing,walking,ph){

/* ---------------- 布局与场景元素 ---------------- */
let riverY=0, leftBound=0, rightBound=0, S=1;
let charL={x:0,y:0}, charR={x:0,y:0};
let stars=[], dust=[], flyers=[];
let shootTimer=3, particles=[], shootingStars=[];
let reqHearts=[], heartsTotal=0, heartsGot=0, flashT=-9;

let lastRecTs=0;

const P_GAP=13, LIFE_MAX=100, FADE=9, ALIVE_MIN=25, CELL=30;

function layout(){

  });

function onResize(){ if(!running) return; layout(); }   // v6：未激活不响应
window.addEventListener('resize', onResize);

/* ---------------- 游戏状态 ---------------- */
let phase='start';         // start | story | play | walk | meet | end
let drawing=false, lastChimeAt=0, lastLeftStroke=-99;
let playStartT=0, doneT=0, birdsDone=0;
let walkPts=[], walkLens=[], walkTotal=1, walkDL=0, walkDR=1, walkSpeed=40, metPos={x:0,y:0};
let events=[];             // 定时事件队列 {t, fn}

/* ---------------- 路径（一笔画 + 自交叉检测） ---------------- */
function dir(ax,ay,bx,by,px,py){ return (bx-ax)*(py-ay)-(by-ay)*(px-ax); }
function onSeg(px,py,ax,ay,bx,by){
  return Math.min(ax,bx)<=px && px<=Math.max(ax,bx) &&
         Math.min(ay,by)<=py && py<=Math.max(ay,by);
}
function segIntersect(ax,ay,bx,by,cx,cy,dx,dy){
  const d1=dir(cx,cy,dx,dy,ax,ay), d2=dir(cx,cy,dx,dy,bx,by);
  const d3=dir(ax,ay,bx,by,cx,cy), d4=dir(ax,ay,bx,by,dx,dy);
  if(((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0))) return true;
  if(Math.abs(d1)<1e-9 && onSeg(ax,ay,cx,cy,dx,dy)) return true;
  if(Math.abs(d2)<1e-9 && onSeg(bx,by,cx,cy,dx,dy)) return true;
  if(Math.abs(d3)<1e-9 && onSeg(cx,cy,ax,ay,bx,by)) return true;
  if(Math.abs(d4)<1e-9 && onSeg(dx,dy,ax,ay,bx,by)) return true;
  return false;
}
function pathSelfCross(a,b){                     // 新段是否撞上历史轨迹
  const n=pts.length;                            // 段k = pts[k]→pts[k+1]，跳过相邻段
  for(let k=0;k<=n-3;k++)
    if(segIntersect(a.x,a.y,b.x,b.y,pts[k].x,pts[k].y,pts[k+1].x,pts[k+1].y))
      return {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
  return null;
}
function addPathPoint(x,y){
  x=clamp(x,10,W-10); y=clamp(y, H*0.10, H-26);
  if(!pts.length){ pts.push({x:x,y:y,life:LIFE_MAX}); collectHeartAt(x,y); return; }
  const p0=pts[pts.length-1];
  const d=dist(p0.x,p0.y,x,y);
  if(d < P_GAP) return;
  const steps=Math.min(60, Math.ceil(d/P_GAP));   // 点距恒≤P_GAP，保证网格连通
  let prev=p0;
  for(let i=1;i<=steps;i++){
    const np={x:lerp(p0.x,x,i/steps), y:lerp(p0.y,y,i/steps), life:LIFE_MAX};
    const hit=pathSelfCross(prev,np);
    if(hit){ failRound('线条交叉啦！', hit.x, hit.y); return; }
    pts.push(np); prev=np;
    collectHeartAt(np.x,np.y);
  }

/* 计算从左岸出发的“存活”桥链（网格 + BFS，支持多笔补画） */
function computeChain(){
  const n=pts.length; if(!n) return null;
  const alive=new Array(n); let any=false;
  for(let i=0;i<n;i++){ alive[i]=pts[i].life>ALIVE_MIN; if(alive[i]) any=true; }
  if(!any) return null;
  const gm=new Map(), key=(cx,cy)=>cx*100000+cy;
  for(let i=0;i<n;i++) if(alive[i]){
    const k=key((pts[i].x/CELL)|0,(pts[i].y/CELL)|0);
    let a=gm.get(k); if(!a){a=[];gm.set(k,a);} a.push(i);
  }
  const parent=new Int32Array(n).fill(-2);
  const q=[]; let head=0;
  parent[0]=-1; q.push(0);                        // 一笔画：从起点出发
  if(!q.length) return null;
  let far=q[0];
  while(head<q.length){
    const i=q[head++];
    if(pts[i].x>pts[far].x) far=i;
    const cx=(pts[i].x/CELL)|0, cy=(pts[i].y/CELL)|0;
    for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
      const a=gm.get(key(cx+dx,cy+dy)); if(!a) continue;
      for(let m=0;m<a.length;m++){ const j=a[m];
        if(parent[j]===-2){ parent[j]=i; q.push(j); } }
    }
  }
  const chain=[]; let cur=far, guard=0;
  while(cur!==-1 && guard++<5000){ chain.push({x:pts[cur].x,y:pts[cur].y}); cur=parent[cur]; }
  chain.reverse();
  return { farX:pts[far].x, chain:chain };
}

/* ---------------- 粒子 / 拾取 / 流星 ---------------- */
function burstHearts(x,y,n,spd){

}

}
function spawnFirework(x,y){
  AU.fw(); vibrate(20);
  const hue=Math.random()*360;
  for(let i=0;i<42;i++){ const a=Math.random()*TAU, v=60+Math.random()*180;
    particles.push({type:'fire',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1+Math.random()*.6,max:1.4,
      size:1.2+Math.random()*1.8,color:'hsl('+(hue+Math.random()*40)+',95%,'+(62+Math.random()*20)+'%)',g:95}); }
}
function spawnHeartForm(cx,cy){ // 心形参数方程粒子
  const s=Math.min(W,H)*0.013;
  for(let k=0;k<84;k++){ const t=k/84*TAU;
    const px=16*Math.pow(Math.sin(t),3);
    const py=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    particles.push({type:'form',x:cx,y:cy,tx:cx+px*s,ty:cy+py*s,life:4.4,max:4.4,born:T,
      size:2.2,color:'hsl('+(338+Math.random()*24)+',95%,'+(66+Math.random()*16)+'%)'});
  }
}
function genHearts(){                             // 横向分区+最小间距，按 x 序必有解
  const x0=leftBound+W*0.02, x1=rightBound-W*0.02;
  const yT=H*0.16, yB=Math.min(riverY+60, H*0.84);
  const floor=Math.min(W,H)*0.105;               // 间距下限（更密以容纳极限颗数）
  let minD=Math.min(W,H)*0.175;                  // 期望间距，放不下逐级放宽
  reqHearts=[];
  while(reqHearts.length<HEARTS_N && minD>=floor){
    reqHearts=[]; let guard=0;
    while(reqHearts.length<HEARTS_N && guard++<2500){
      const t=HEARTS_N===1?0.5:reqHearts.length/(HEARTS_N-1);
      const x=clamp(lerp(x0,x1,t)+(Math.random()*2-1)*W*0.02, x0, x1);
      const y=lerp(yT,yB, 0.06+0.88*Math.random());
      let ok=true;
      for(const h of reqHearts) if(dist(x,y,h.x,h.y)<minD){ ok=false; break; }
      if(ok) reqHearts.push({x:x,y:y,got:false});
    }
    if(reqHearts.length<HEARTS_N) minD*=0.90;
  }
  heartsTotal=reqHearts.length;
}
function collectHeartAt(x,y){
  for(const h of reqHearts){
    if(!h.got && dist(x,y,h.x,h.y)<34){
      h.got=true; heartsGot++;
      $('heartNum').textContent=heartsGot+'/'+heartsTotal;
      AU.collect(); vibrate(15); burstHearts(h.x,h.y,10,90);
      particles.push({type:'ring',x:h.x,y:h.y,life:.5,max:.5,size:10});
      if(heartsGot===heartsTotal) toast('爱心集齐！一笔冲向emma 💫');
    }
  }
}
function resetHearts(){
  for(const h of reqHearts) h.got=false;
  heartsGot=0; $('heartNum').textContent='0/'+heartsTotal;
}
/* ---------------- 参考轨迹（x 单调 ⇒ 必不自交） ---------------- */
function buildHintPath(){
  const hs=reqHearts.map(function(h){ return {x:h.x,y:h.y}; })
    .sort(function(a,b){ return a.x-b.x || a.y-b.y; });
  const nodes=[{x:charL.x+6,y:charL.y-34*S}].concat(hs,[{x:charR.x-6,y:charR.y-34*S}]);
  const out=[];
  for(let i=1;i<nodes.length;i++){
    const a=nodes[i-1], b=nodes[i], d=dist(a.x,a.y,b.x,b.y), steps=Math.max(1,Math.ceil(d/9));
    for(let k=0;k<steps;k++) out.push({x:lerp(a.x,b.x,k/steps), y:lerp(a.y,b.y,k/steps)});
  }
  out.push(nodes[nodes.length-1]);
  return out;
}
function drawHintPath(){
  if(!hintPath) return;
  const age=T-hintT0;
  if(age>7.5){ hintPath=null; return; }
  const reveal=clamp(age/2.0,0,1);
  const fade=age>6 ? clamp(1-(age-6)/1.5,0,1) : 1;
  const n=Math.max(2, Math.floor(hintPath.length*reveal));
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.setLineDash([9,9]); ctx.lineDashOffset=-T*46; ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,224,140,'+(0.5*fade).toFixed(3)+')'; ctx.lineWidth=7;
  ctx.beginPath();
  for(let i=0;i<n;i++){ const p=hintPath[i]; if(i) ctx.lineTo(p.x,p.y); else ctx.moveTo(p.x,p.y); }
  ctx.stroke();
  ctx.strokeStyle='rgba(255,250,225,'+(0.95*fade).toFixed(3)+')'; ctx.lineWidth=2.2;
  ctx.beginPath();
  for(let i=0;i<n;i++){ const p=hintPath[i]; if(i) ctx.lineTo(p.x,p.y); else ctx.moveTo(p.x,p.y); }
  ctx.stroke();
  ctx.setLineDash([]);
  if(reveal<1){
    const tip=hintPath[n-1], pu=.5+.5*Math.sin(T*8);
    ctx.fillStyle='rgba(255,245,200,'+(0.6+0.4*pu).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(tip.x,tip.y,3.5+1.5*pu,0,TAU); ctx.fill();
  }
  ctx.restore();
}
function startRound(newHearts){
  hintPath=null;
  if(newHearts || !reqHearts.length) genHearts(); else resetHearts();
  heartsGot=0;                                   // 关键：无论哪个分支都清零计数
  $('heartNum').textContent='0/'+heartsTotal;
  pts=[]; drawing=false; lastLeftStroke=-99;
  $('progressBar').style.width='0%'; $('progressText').textContent='鹊桥 0%';
  phase='play'; playStartT=T;
}
function failRound(msg, x, y){
  drawing=false; flashT=T; hintPath=null;
  for(let i=0;i<26;i++){ const a=Math.random()*TAU, v=50+Math.random()*130;
    particles.push({type:'fire',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.7+Math.random()*.4,max:1,
      size:1.4+Math.random()*1.6,color:'hsl('+(350+Math.random()*20)+',95%,'+(58+Math.random()*18)+'%)',g:60}); }
  AU.fail(); vibrate([60,50,80]);
  pts=[]; resetHearts(); lastLeftStroke=-99;
  $('progressBar').style.width='0%'; $('progressText').textContent='鹊桥 0%';
  toast(msg+' 从猴子重新开始 👈', 2800);
}

/* ---------------- 更新逻辑 ---------------- */
function update(dt){
  // 背景动效
  for(const d of dust){ d.x+=d.sp*dt; if(d.x>W+4) d.x=-4; }
  for(const f of flyers){
    f.x+=f.vx*dt;
    if(f.vx>0 && f.x>W+40){ f.x=-40; f.y=H*(0.1+Math.random()*0.32); }
    if(f.vx<0 && f.x<-40){ f.x=W+40; f.y=H*(0.1+Math.random()*0.32); }
  }
  shootTimer-=dt;
  if(shootTimer<=0){ shootTimer=3.5+Math.random()*5;
    shootingStars.push({x:W*(0.2+Math.random()*0.8), y:H*(0.05+Math.random()*0.35),
      vx:-220-Math.random()*160, vy:90+Math.random()*60, life:.9}); }
  for(let i=shootingStars.length-1;i>=0;i--){ const s=shootingStars[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt; if(s.life<=0) shootingStars.splice(i,1); }

  // 粒子
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life-=dt;
    if(p.type==='heart'||p.type==='fire'){ p.vy+=(p.g||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.type==='fire'){ p.vx*=(1-1.6*dt); p.vy*=(1-0.6*dt); } }
    if(p.life<=0) particles.splice(i,1);
  }
  // 定时事件
  for(let i=events.length-1;i>=0;i--) if(T>=events[i].t){ const e=events.splice(i,1)[0]; e.fn(); }

  if(phase==='play'){
    if(!drawing) for(const p of pts) p.life-=FADE*dt;    // 落笔时不冲淡（一笔画公平性）
    if(pts.length && pts.filter(p=>p.life<=2).length>240) pts=pts.filter(p=>p.life>2);

    const ch=computeChain();
    let pct=0;
    if(ch){
      pct=clamp((ch.farX-leftBound)/(rightBound-leftBound),0,1);
      if(ch.farX>=rightBound){
        if(heartsGot>=heartsTotal){ completeBridge(ch); return; }
        const last=pts[pts.length-1];
        failRound('还有 '+(heartsTotal-heartsGot)+' 颗爱心没穿过！', last.x, last.y);
        return;
      }
    }
    $('progressBar').style.width=(pct*100).toFixed(0)+'%';
    $('progressText').textContent='鹊桥 '+(pct*100).toFixed(0)+'%';
  }
  else if(phase==='walk'){
    walkDL+=walkSpeed*dt; walkDR-=walkSpeed*dt;
    if(walkDL>=walkTotal/2){ walkDL=walkTotal/2; walkDR=walkTotal/2; startMeet(); }
  }
  else if(phase==='meet'){
    if(!update.hb || T-update.hb>0.42){ update.hb=T;
      burstHearts(metPos.x+(Math.random()*30-15), metPos.y-60*S, 2, 40); }
  }
}
function completeBridge(ch){
  phase='walk'; doneT=T; drawing=false; hintPath=null;
  birdsDone=0;
  for(let i=0;i<pts.length;i+=3) if(pts[i].life>ALIVE_MIN) birdsDone++;
  walkPts=[{x:charL.x,y:charL.y-4}]                        // 严格沿玩家笔迹行走
    .concat(pts.map(function(p){ return {x:p.x,y:p.y}; }),
            [{x:charR.x,y:charR.y-4}]);
  walkLens=[0];
  for(let i=1;i<walkPts.length;i++)
    walkLens[i]=walkLens[i-1]+dist(walkPts[i-1].x,walkPts[i-1].y,walkPts[i].x,walkPts[i].y);
  walkTotal=Math.max(walkLens[walkLens.length-1],1);
  walkSpeed=walkTotal/4.6; walkDL=0; walkDR=walkTotal;
  $('progressBar').style.width='100%'; $('progressText').textContent='鹊桥完成 💞';
  AU.fanfare(); vibrate([30,60,90]);
  toast('鹊桥搭好啦！他们来了 ✨');
}
function posAt(d){
  d=clamp(d,0,walkTotal);
  let i=1; while(i<walkLens.length-1 && walkLens[i]<d) i++;
  const seg=Math.max(walkLens[i]-walkLens[i-1],0.001);
  const t=(d-walkLens[i-1])/seg;
  return {x:lerp(walkPts[i-1].x,walkPts[i].x,t), y:lerp(walkPts[i-1].y,walkPts[i].y,t)};
}
function startMeet(){
  phase='meet'; metPos=posAt(walkTotal/2);
  AU.meetChord(); vibrate([40,80,120]);
  spawnHeartForm(W/2, H*0.36);
  burstHearts(metPos.x, metPos.y-40*S, 16, 130);
  const delays=[0.3,0.8,1.3,1.9,2.4,3.0];
  for(const d of delays)
    events.push({t:T+d, fn:function(){ spawnFirework(W*(0.2+0.6*Math.random()), H*(0.16+0.3*Math.random())); }});
  events.push({t:T+2.7, fn:showEnd});
}

/* ---------------- 绘制 ---------------- */
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#050218'); g.addColorStop(.45,'#0e0a38');
  g.addColorStop(.75,'#1b1050'); g.addColorStop(1,'#2a1560');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 月亮（七夕蛾眉月）
  const mx=W*0.84, my=H*0.13, mr=Math.min(W,H)*0.042;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const rg=ctx.createRadialGradient(mx,my,mr*.2,mx,my,mr*3);
  rg.addColorStop(0,'rgba(255,240,210,.32)'); rg.addColorStop(1,'rgba(255,240,210,0)');
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(mx,my,mr*3,0,TAU); ctx.fill(); ctx.restore();
  ctx.fillStyle='#fff4d6'; ctx.beginPath(); ctx.arc(mx,my,mr,0,TAU); ctx.fill();
  ctx.fillStyle='#0d0934'; ctx.beginPath(); ctx.arc(mx-mr*.42,my-mr*.16,mr*.9,0,TAU); ctx.fill();
  // 星星与流星
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const s of stars){
    const a=.35+.65*(.5+.5*Math.sin(T*s.sp+s.ph));
    ctx.fillStyle='rgba(220,230,255,'+a.toFixed(3)+')';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill();
    if(s.r>1.5){ ctx.strokeStyle='rgba(255,255,255,'+(a*.5).toFixed(3)+')'; ctx.lineWidth=.7;
      const L=s.r*3.4; ctx.beginPath();
      ctx.moveTo(s.x-L,s.y); ctx.lineTo(s.x+L,s.y);
      ctx.moveTo(s.x,s.y-L); ctx.lineTo(s.x,s.y+L); ctx.stroke(); }
  }
  for(const s of shootingStars){
    const a=clamp(s.life,0,1);
    const gr=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*.22,s.y-s.vy*.22);
    gr.addColorStop(0,'rgba(255,255,255,'+a.toFixed(3)+')'); gr.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=gr; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*.22,s.y-s.vy*.22); ctx.stroke();
  }
  ctx.restore();
  // 银河
  const bh=H*0.09;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const g2=ctx.createLinearGradient(0,riverY-bh*2,0,riverY+bh*2);
  g2.addColorStop(0,'rgba(130,160,255,0)'); g2.addColorStop(.5,'rgba(150,175,255,.10)');
  g2.addColorStop(1,'rgba(130,160,255,0)');
  ctx.fillStyle=g2; ctx.fillRect(0,riverY-bh*2,W,bh*4);
  for(const d of dust){
    const a=.25+.4*(.5+.5*Math.sin(T*1.4+d.ph));
    ctx.fillStyle='rgba(205,220,255,'+a.toFixed(3)+')';
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,TAU); ctx.fill();
  }
  for(let k=-1;k<=1;k++){
    ctx.strokeStyle='rgba(190,210,255,.07)'; ctx.lineWidth=16;
    ctx.beginPath();
    for(let x=0;x<=W;x+=14){ const y=riverY+k*30+Math.sin(x*0.012+T*1.1+k*2)*7;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    ctx.stroke();
  }
  ctx.restore();
  // 远处飞鸟
  ctx.strokeStyle='rgba(210,220,255,.55)'; ctx.lineWidth=1.6; ctx.lineCap='round';
  for(const f of flyers){
    const fl=Math.sin(T*9+f.ph)*3.6*f.s;
    ctx.beginPath();
    ctx.moveTo(f.x-7*f.s,f.y); ctx.quadraticCurveTo(f.x-3.5*f.s,f.y-fl,f.x,f.y);
    ctx.quadraticCurveTo(f.x+3.5*f.s,f.y-fl,f.x+7*f.s,f.y); ctx.stroke();
  }
}
function drawBank(x){
  const y=riverY+16;
  ctx.fillStyle='#141d4d';
  const blobs=[[0,0,26],[24,5,20],[-26,6,18],[12,-11,18],[-13,-9,16],[38,10,14],[-40,11,13]];
  for(const b of blobs){ ctx.beginPath(); ctx.arc(x+b[0]*S, y+b[1]*S, b[2]*S,0,TAU); ctx.fill(); }
  ctx.strokeStyle='rgba(150,180,255,.20)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(x, y, 26*S, Math.PI*1.05, Math.PI*1.95); ctx.stroke();
}
function drawBridge(){
  if(!pts.length) return;
  const n=pts.length, alive=new Array(n); let any=false;
  for(let i=0;i<n;i++){ alive[i]=pts[i].life>ALIVE_MIN; if(alive[i]) any=true; }
  if(!any) return;
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='rgba(140,205,255,.16)'; ctx.lineWidth=10; ctx.beginPath();  // 光晕
  for(let i=0;i<n-1;i++) if(alive[i]&&alive[i+1]){
    ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[i+1].x,pts[i+1].y); }
  ctx.stroke();
  for(let i=0;i<n-1;i++) if(alive[i]&&alive[i+1]){                            // 亮芯
    const f=pts[i].life/LIFE_MAX;
    ctx.strokeStyle='rgba('+((lerp(255,140,f))|0)+','+((lerp(130,225,f))|0)+','+((lerp(185,250,f))|0)+',.95)';
    ctx.lineWidth=2.4; ctx.beginPath();
    ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[i+1].x,pts[i+1].y); ctx.stroke();
  }
  ctx.restore();
  // 喜鹊（每隔3个点落一只）
  for(let i=0;i<n;i+=3){
    if(!alive[i]) continue;
    const p=pts[i], prev=pts[Math.max(i-2,0)], next=pts[Math.min(i+2,n-1)];
    const dir=(next.x-prev.x)>=0?1:-1;
    const fresh=clamp((p.life-84)/16,0,1);
    const bob=Math.sin(T*3+i)*1.4;
    drawMagpie(p.x, p.y-7+bob, S*(1+fresh*.35)*0.92, dir, p.life);
  }
}
function drawMagpie(x,y,s,dir,life){

function drawZhinv(x,y,s,facing,walking,ph){
  ctx.save(); ctx.translate(x,y); ctx.scale(facing*s,s);

  ctx.save(); ctx.globalCompositeOperation='lighter';

  ctx.beginPath(); ctx.moveTo(-3,-12+bob*.3); ctx.lineTo(-3+leg,-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3,-12+bob*.3); ctx.lineTo(3-leg,-1); ctx.stroke();
  ctx.save(); ctx.translate(0,bob);
  const g=ctx.createLinearGradient(0,-34,0,-6); g.addColorStop(0,'#ff9ec7'); g.addColorStop(1,'#c75f9d');
  ctx.fillStyle=g; ctx.beginPath();                       // 裙
  ctx.moveTo(-6,-32); ctx.quadraticCurveTo(-15,-12,-13,-6); ctx.lineTo(13,-6);
  ctx.quadraticCurveTo(15,-12,6,-32); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#ffd76e'; ctx.lineWidth=1.6;           // 腰带
  ctx.beginPath(); ctx.moveTo(-10,-21); ctx.lineTo(10,-21); ctx.stroke();
  ctx.strokeStyle='rgba(255,211,232,.85)'; ctx.lineWidth=2.4;  // 飘带
  const sx=[-1,1];
  for(let k=0;k<2;k++){ const d=sx[k];
    ctx.beginPath(); ctx.moveTo(d*6,-27);
    ctx.quadraticCurveTo(d*16, -20+Math.sin(T*2.4+d)*3, d*20, -8+Math.sin(T*2.4+d*2)*4); ctx.stroke();
  }
  ctx.strokeStyle='#f0b7d4'; ctx.lineWidth=2.6;           // 手臂
  ctx.beginPath(); ctx.moveTo(-5,-27); ctx.quadraticCurveTo(-9,-21,-7,-16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5,-27); ctx.quadraticCurveTo(9,-21,7,-16); ctx.stroke();
  ctx.strokeStyle='rgba(255,224,140,.8)'; ctx.lineWidth=1;      // 金梭银线
  ctx.beginPath(); ctx.moveTo(7,-16);
  ctx.quadraticCurveTo(16,-24+Math.sin(T*2)*2,22,-18); ctx.stroke();

  ctx.restore();
  ctx.fillStyle='#2b2038'; ctx.beginPath(); ctx.arc(0,-41,9,0,TAU); ctx.fill();   // 头发
  ctx.beginPath(); ctx.arc(-6.4,-47.6,3,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6.4,-47.6,3,0,TAU); ctx.fill();
  for(let k=0;k<5;k++){ const a=k/5*TAU;                    // 头上的花
    ctx.fillStyle='#ff9ec7'; ctx.beginPath();
    ctx.arc(4.8+Math.cos(a)*2.2,-48.6+Math.sin(a)*2.2,1.3,0,TAU); ctx.fill(); }
  ctx.fillStyle='#ffd76e'; ctx.beginPath(); ctx.arc(4.8,-48.6,1.2,0,TAU); ctx.fill();
  ctx.fillStyle='#ffe3c4'; ctx.beginPath(); ctx.arc(0,-40,7.6,0,TAU); ctx.fill();
  ctx.fillStyle='#23202e';
  ctx.beginPath(); ctx.arc(2.6,-41,1.05,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6.2,-41,1.05,0,TAU); ctx.fill();
  ctx.strokeStyle='#23202e'; ctx.lineWidth=.8;              // 睫毛
  ctx.beginPath(); ctx.moveTo(1.6,-42.4); ctx.lineTo(3.6,-43); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5.2,-43); ctx.lineTo(7.2,-42.4); ctx.stroke();
  ctx.fillStyle='rgba(255,130,150,.5)';
  ctx.beginPath(); ctx.arc(1.2,-38.4,1.4,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(7.6,-38.4,1.4,0,TAU); ctx.fill();
  ctx.strokeStyle='#23202e'; ctx.lineWidth=.9;
  ctx.beginPath(); ctx.arc(4.4,-38.8,1.8,.25*Math.PI,.75*Math.PI); ctx.stroke();

function label(text,x,y,color){
  ctx.font=Math.round(12*S)+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
