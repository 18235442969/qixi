<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0630">
<meta name="description" content="七夕 · 鹊桥相会：亲手搭一座鹊桥，穿过所有爱心，把心意传给TA">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💞</text></svg>">
<title>鹊桥相会 · 七夕</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;width:100%;overflow:hidden;position:fixed;background:#07031f;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none}
  #cv{position:fixed;inset:0;touch-action:none;display:block}

  /* ---------- 通用弹层 ---------- */
  .screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(ellipse at 50% 38%, rgba(38,24,92,.55), rgba(5,2,24,.88));
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transition:opacity .6s}
  .screen.hidden{opacity:0;pointer-events:none}
  .kai{font-family:"STKaiti","KaiTi","Kaiti SC","FZKai-Z03S","Noto Serif SC",serif}

  .card{width:min(420px,94vw);background:linear-gradient(165deg, rgba(42,28,96,.94), rgba(18,10,52,.97));
    border:1px solid rgba(255,160,210,.35);border-radius:26px;padding:30px 24px 24px;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 0 46px rgba(255,110,180,.10);
    animation:cardIn .7s cubic-bezier(.2,.9,.3,1.25) both}
  @keyframes cardIn{from{transform:translateY(34px) scale(.92);opacity:0}}
  .deco{font-size:34px;filter:drop-shadow(0 0 12px #ff6ea9);animation:beat 1.6s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}36%{transform:scale(1.16)}48%{transform:scale(1)}}
  h1{font-size:42px;letter-spacing:10px;text-indent:10px;margin:4px 0 2px;
    background:linear-gradient(180deg,#ffe1f0,#ff8fc0 55%,#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,140,200,.35))}
  .sub{color:#b9a8e8;font-size:13px;letter-spacing:5px;margin-bottom:18px}
  .inputs{display:flex;align-items:center;gap:8px;margin:6px 0 18px}
  .inputs input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    border-radius:12px;padding:11px 8px;color:#fff;font-size:14px;text-align:center;outline:none;font-family:inherit}
  .inputs input::placeholder{color:#7d6fb0}
  .inputs input:focus{border-color:#ff8fc0;box-shadow:0 0 0 3px rgba(255,143,192,.22)}
  .heartJoin{color:#ff6ea9;font-size:15px;animation:beat 1.6s infinite}
  .btn{border:none;outline:none;background:linear-gradient(135deg,#ff6ea9,#b388ff 55%,#7ee8fa);color:#fff;
    font-size:16px;letter-spacing:3px;padding:13px 32px;border-radius:999px;font-family:inherit;cursor:pointer;
    box-shadow:0 8px 26px rgba(255,110,169,.45), inset 0 1px 0 rgba(255,255,255,.45);transition:transform .15s}
  .btn:active{transform:scale(.93)}
  .btn.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);box-shadow:none}
  .tip{color:#8f80c0;font-size:12px;margin-top:14px;line-height:1.8}

  /* ---------- 头像 ---------- */
  .deco{display:flex;align-items:center;justify-content:center}
  .deco img{width:56px;height:56px;border-radius:50%;object-fit:cover;
    border:2.5px solid rgba(255,180,220,.85);box-shadow:0 0 16px rgba(255,110,180,.55)}
  .deco .dj{font-size:20px;margin:0 10px;color:#ff6ea9;animation:beat 1.6s infinite}

  /* ---------- 排行榜 ---------- */
  #boardList{max-height:46vh;overflow-y:auto;text-align:left;-webkit-overflow-scrolling:touch}
  .brow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;margin:5px 0;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);color:#e9e0ff;font-size:13px}
  .brow.new{border-color:rgba(255,143,192,.7);background:rgba(255,110,169,.13)}
  .brow .rk{width:34px;text-align:center;font-size:17px;flex:none}
  .brow .bm{flex:1;min-width:0;line-height:1.55}
  .brow .bm b{color:#ffd9ec;font-size:14px}
  .brow .bd{text-align:right;color:#8f80c0;font-size:11px;line-height:1.6;flex:none}

  /* ---------- 开场故事 ---------- */
  .story{text-align:center;max-width:520px}
  .story p{font-size:19px;color:#cfc3f5;letter-spacing:3px;margin:11px 0;opacity:0;animation:lineIn .9s both}
  .story .hl{color:#ffd9ec;font-size:22px;text-shadow:0 0 18px rgba(255,140,200,.7)}
  @keyframes lineIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  #storyBtn{margin-top:30px;opacity:0;animation:lineIn .8s 4.1s both}

  /* ---------- 结算 ---------- */
  .ring{font-size:40px;filter:drop-shadow(0 0 14px #ff6ea9);animation:beat 1.4s infinite}
  h2{font-size:30px;letter-spacing:8px;color:#ffd9ec;text-shadow:0 0 20px rgba(255,140,200,.5);margin:4px 0 10px}
  .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,160,210,.6),transparent);margin:4px 0 12px}
  #endMsg{white-space:pre-line;color:#e9e0ff;font-size:15px;line-height:2.05;letter-spacing:1px}
  .stats{display:flex;gap:8px;margin:16px 0 4px}
  .stats>div{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 4px}
  .stats b{display:block;color:#ffd9ec;font-size:18px;font-weight:600}
  .stats span{color:#8f80c0;font-size:11px;letter-spacing:2px}
  .btnRow{display:flex;gap:10px;margin-top:18px;justify-content:center}
  .btnRow .btn{padding:12px 22px;font-size:14px}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;z-index:10;
    padding:calc(env(safe-area-inset-top, 0px) + 10px) 14px 0;display:flex;gap:10px;align-items:center;
    transition:opacity .4s}
  #hud.hidden{opacity:0;pointer-events:none}
  #progressWrap{flex:1;max-width:300px;height:20px;border-radius:999px;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16);position:relative;overflow:hidden}
  #progressBar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#7ee8fa,#b388ff,#ff8fc0);
    transition:width .25s;box-shadow:0 0 14px rgba(179,136,255,.8)}
  #progressText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;letter-spacing:2px}
  #heartChip{background:rgba(255,110,169,.16);border:1px solid rgba(255,110,169,.4);color:#ffb3d1;
    border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
  #muteBtn,#hintBtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.22);color:#fff;font-size:15px;flex:none}
  #hintBtn{animation:beat 2.8s infinite}

  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom, 0px) + 40px);z-index:40;
    transform:translateX(-50%) translateY(24px);background:rgba(22,13,58,.94);border:1px solid rgba(255,143,192,.45);
    color:#ffe3f1;padding:10px 20px;border-radius:999px;font-size:13px;letter-spacing:1px;
    opacity:0;transition:.45s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- 顶部 HUD -->
<div id="hud" class="hidden">
  <div id="progressWrap"><div id="progressBar"></div><span id="progressText">鹊桥 0%</span></div>
  <div id="heartChip">❤ <b id="heartNum">0</b></div>
  <button id="hintBtn" title="显示参考轨迹">💡</button>
  <button id="muteBtn">🔊</button>
</div>

<!-- 开始页 -->
<div id="startScreen" class="screen">
  <div class="card">
    <div class="deco" id="decoBox"><img id="decoL" alt="我"><span class="dj">❤</span><img id="decoR" alt="TA"></div>
    <h1 class="kai">鹊桥相会</h1>
    <p class="sub">七夕 · 为爱搭一座桥</p>
    <div class="inputs">
      <input id="meName" placeholder="你的名字" maxlength="8" value="猴子">
      <div class="heartJoin">❤</div>
      <input id="taName" placeholder="TA的名字" maxlength="8" value="emma">
    </div>
    <button id="startBtn" class="btn">开始搭桥 💞</button>
    <p class="tip">极限模式：每轮 20 颗爱心（按屏幕自动放满）<br>从猴子出发一笔画到emma，穿过所有爱心<br>线条不能交叉、不能断笔 · 卡住点右上角 💡<br>桥越长喜鹊越多，上榜争第一 🏆</p>
    <button id="boardBtn" class="btn ghost" style="margin-top:10px;padding:9px 22px;font-size:13px">🏆 排行榜</button>
  </div>
</div>

<!-- 开场故事 -->
<div id="storyScreen" class="screen hidden">
  <div class="story kai">
    <p style="animation-delay:.2s">相传每年七月初七，</p>
    <p style="animation-delay:1.2s">天下喜鹊飞上天河，以身搭桥，</p>
    <p style="animation-delay:2.2s">让牛郎织女银河相会。</p>
    <p style="animation-delay:3.3s" class="hl">今年，这座桥由你来搭 ✨</p>
    <button id="storyBtn" class="btn">我来了</button>
  </div>
</div>

<!-- 结算页 -->
<div id="endScreen" class="screen hidden">
  <div class="card">
    <div class="ring">💞</div>
    <h2 class="kai">相会成功</h2>
    <div class="divider"></div>
    <p id="endMsg" class="kai"></p>
    <div class="stats">
      <div><b id="stTime">-</b><span>用时</span></div>
      <div><b id="stBirds">-</b><span>喜鹊</span></div>
      <div><b id="stHearts">-</b><span>爱心</span></div>
    </div>
    <p class="tip" id="bestLine" style="margin-top:8px"></p>
    <div class="btnRow">
      <button id="againBtn" class="btn">再搭一次 💞</button>
      <button id="boardEndBtn" class="btn ghost">排行榜 🏆</button>
    </div>
  </div>
</div>

<!-- 排行榜 -->
<div id="boardScreen" class="screen hidden">
  <div class="card">
    <h2 class="kai" style="letter-spacing:4px;font-size:26px">🏆 排行榜</h2>
    <p class="sub" style="margin-bottom:12px">喜鹊越多越靠前 · 同数量耗时越少越靠前</p>
    <div id="boardList"></div>
    <button id="boardClose" class="btn ghost" style="margin-top:16px">关闭</button>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ================================================================
   鹊桥相会 · 七夕互动小游戏（单文件 / 触屏适配 / 无外部依赖）
   玩法：手指从牛郎处一笔划到织女处，喜鹊沿笔迹搭桥；
         桥会被银河慢慢冲淡，需一气呵成（或补画）。
   ================================================================ */

/* ---------------- 基础与工具 ---------------- */
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $   = id => document.getElementById(id);
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const dist  = (ax,ay,bx,by)=> Math.hypot(ax-bx, ay-by);
const TAU = Math.PI*2;

let W=0, H=0, DPR=1, T=0;

/* ---------------- 音效（WebAudio 本地合成，无音频文件） ---------------- */
const AU = {
  ctx:null, master:null, muted:false,
  init(){
    if(this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    try{
      this.ctx = new C();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : .5;
      this.master.connect(this.ctx.destination);
    }catch(e){ this.ctx=null; }
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.value = m?0:.5; },
  tone(f, dur, type, vol, delay, slideTo){
    dur=dur||.3; type=type||'sine'; vol=vol||.25; delay=delay||0;
    if(!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0);
    if(slideTo>0) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+dur+.05);
  },
  noise(dur, vol, fc, delay){
    dur=dur||.25; vol=vol||.2; fc=fc||1200; delay=delay||0;
    if(!this.ctx || this.muted) return;
    const t0=this.ctx.currentTime+delay, n=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource(); s.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fc;
    const g=this.ctx.createGain(); g.gain.value=vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t0);
  },
  pent:[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98,1760],
  chime(step){
    const f=this.pent[clamp(step|0,0,9)];
    this.tone(f,.26,'sine',.2); this.tone(f*2,.16,'sine',.05);
  },
  collect(){ this.tone(1318.5,.12,'sine',.2); this.tone(1760,.2,'sine',.16,.07); },
  pop(){ this.noise(.12,.16,1600); },
  fail(){ this.tone(320,.4,'sawtooth',.12,0,110); },
  fanfare(){
    [523.25,659.25,783.99,1046.5].forEach((f,i)=> this.tone(f,.34,'triangle',.24,i*.09));
    [261.6,329.6,392,523.25].forEach(f=> this.tone(f,1.3,'sine',.08,.25));
  },
  meetChord(){
    [261.6,329.6,392,523.25].forEach((f,i)=> this.tone(f,2.4,'sine',.1,i*.05));
    this.tone(1567.98,.5,'sine',.1,.35,2093);
  },
  fw(delay){ this.noise(.35,.22,900,delay||0); this.tone(220,.4,'sine',.12,delay||0,70); }
};
const vibrate = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

function drawAvatar(k,x,y,s,facing,walking,ph){
  const a=AV[k];
  if(!a.ok){                                       // 照片未就绪：回退卡通形象
    if(k==='L') drawNiulang(x,y,s,facing,walking,ph); else drawZhinv(x,y,s,facing,walking,ph);
    return;
  }
  const bob = walking ? Math.abs(Math.sin(ph))*2.4 : Math.sin(T*2+(k==='L'?0:1))*1.2;
  const r=17*s;
  ctx.save(); ctx.translate(x,y-r*1.15+bob);
  ctx.save(); ctx.globalCompositeOperation='lighter';           // 光晕
  ctx.fillStyle=(k==='L')?'rgba(120,180,255,.30)':'rgba(255,150,210,.32)';
  ctx.beginPath(); ctx.arc(0,0,r*1.85,0,TAU); ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.clip(); // 圆形裁剪照片
  const iw=a.img.width, ih=a.img.height, sc=Math.max(2*r/iw,2*r/ih);
  ctx.drawImage(a.img, -iw*sc/2, -ih*sc/2, iw*sc, ih*sc);
  ctx.restore();
  ctx.lineWidth=2.4; ctx.strokeStyle=(k==='L')?'#9fc6ff':'#ffb3d6';
  ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.stroke();
  ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.arc(0,0,r-3.4,0,TAU); ctx.stroke();
  ctx.font=Math.round(9*s)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillText((k==='L')?'⭐':'💖', r*0.78, -r*0.82);
  ctx.restore();
}

  stars=[]; const nStar = clamp(Math.round(W*H/9000),60,150);
  for(let i=0;i<nStar;i++) stars.push({
    x:Math.random()*W, y:Math.random()*H*0.92,
    r:.6+Math.random()*1.3, ph:Math.random()*TAU, sp:.6+Math.random()*1.6
  });
  dust=[]; const bh=H*0.09;

/* ---------------- 路径（一笔画 + 自交叉检测） ---------------- */
function dir(ax,ay,bx,by,px,py){ return (bx-ax)*(py-ay)-(by-ay)*(px-ax); }
function onSeg(px,py,ax,ay,bx,by){
  return Math.min(ax,bx)<=px && px<=Math.max(ax,bx) &&
         Math.min(ay,by)<=py && py<=Math.max(ay,by);
}
function segIntersect(ax,ay,bx,by,cx,cy,dx,dy){
  const d1=dir(cx,cy,dx,dy,ax,ay), d2=dir(cx,cy,dx,dy,bx,by);
  const d3=dir(ax,ay,bx,by,cx,cy), d4=dir(ax,ay,bx,by,dx,dy);
  if(((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0))) return true;
  if(Math.abs(d1)<1e-9 && onSeg(ax,ay,cx,cy,dx,dy)) return true;
  if(Math.abs(d2)<1e-9 && onSeg(bx,by,cx,cy,dx,dy)) return true;
  if(Math.abs(d3)<1e-9 && onSeg(cx,cy,ax,ay,bx,by)) return true;
  if(Math.abs(d4)<1e-9 && onSeg(dx,dy,ax,ay,bx,by)) return true;
  return false;
}
function pathSelfCross(a,b){                     // 新段是否撞上历史轨迹
  const n=pts.length;                            // 段k = pts[k]→pts[k+1]，跳过相邻段
  for(let k=0;k<=n-3;k++)
    if(segIntersect(a.x,a.y,b.x,b.y,pts[k].x,pts[k].y,pts[k+1].x,pts[k+1].y))
      return {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
  return null;
}
function addPathPoint(x,y){
  x=clamp(x,10,W-10); y=clamp(y, H*0.10, H-26);
  if(!pts.length){ pts.push({x:x,y:y,life:LIFE_MAX}); collectHeartAt(x,y); return; }
  const p0=pts[pts.length-1];
  const d=dist(p0.x,p0.y,x,y);
  if(d < P_GAP) return;
  const steps=Math.min(60, Math.ceil(d/P_GAP));   // 点距恒≤P_GAP，保证网格连通
  let prev=p0;
  for(let i=1;i<=steps;i++){
    const np={x:lerp(p0.x,x,i/steps), y:lerp(p0.y,y,i/steps), life:LIFE_MAX};
    const hit=pathSelfCross(prev,np);
    if(hit){ failRound('线条交叉啦！', hit.x, hit.y); return; }
    pts.push(np); prev=np;
    collectHeartAt(np.x,np.y);
  }
  if(pts.length>900) pts.splice(0, pts.length-900);
  const step=clamp((x-leftBound)/(rightBound-leftBound)*10,0,9);
  const nowT=performance.now();
  if(nowT-lastChimeAt>80){ lastChimeAt=nowT; AU.chime(step); vibrate(6); }
}
/* 计算从左岸出发的“存活”桥链（网格 + BFS，支持多笔补画） */
function computeChain(){
  const n=pts.length; if(!n) return null;
  const alive=new Array(n); let any=false;
  for(let i=0;i<n;i++){ alive[i]=pts[i].life>ALIVE_MIN; if(alive[i]) any=true; }
  if(!any) return null;
  const gm=new Map(), key=(cx,cy)=>cx*100000+cy;
  for(let i=0;i<n;i++) if(alive[i]){
    const k=key((pts[i].x/CELL)|0,(pts[i].y/CELL)|0);
    let a=gm.get(k); if(!a){a=[];gm.set(k,a);} a.push(i);
  }
  const parent=new Int32Array(n).fill(-2);
  const q=[]; let head=0;
  parent[0]=-1; q.push(0);                        // 一笔画：从起点出发
  if(!q.length) return null;
  let far=q[0];
  while(head<q.length){
    const i=q[head++];
    if(pts[i].x>pts[far].x) far=i;
    const cx=(pts[i].x/CELL)|0, cy=(pts[i].y/CELL)|0;
    for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
      const a=gm.get(key(cx+dx,cy+dy)); if(!a) continue;
      for(let m=0;m<a.length;m++){ const j=a[m];
        if(parent[j]===-2){ parent[j]=i; q.push(j); } }
    }
  }
  const chain=[]; let cur=far, guard=0;
  while(cur!==-1 && guard++<5000){ chain.push({x:pts[cur].x,y:pts[cur].y}); cur=parent[cur]; }
  chain.reverse();
  return { farX:pts[far].x, chain:chain };
}

/* ---------------- 粒子 / 拾取 / 流星 ---------------- */
function burstHearts(x,y,n,spd){
  n=n||6; spd=spd||70;
  for(let i=0;i<n;i++){ const a=Math.random()*TAU, v=spd*(.5+Math.random());
    particles.push({type:'heart',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,life:1.1,max:1.1,
      size:5+Math.random()*6,color:'hsl('+(330+Math.random()*30)+',95%,'+(68+Math.random()*12)+'%)',g:-20}); }
}
function ripple(x,y){
  particles.push({type:'ring',x:x,y:y,life:.5,max:.5,size:8});
  burstHearts(x,y,3,50);
}
function spawnFirework(x,y){
  AU.fw(); vibrate(20);
  const hue=Math.random()*360;
  for(let i=0;i<42;i++){ const a=Math.random()*TAU, v=60+Math.random()*180;
    particles.push({type:'fire',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1+Math.random()*.6,max:1.4,
      size:1.2+Math.random()*1.8,color:'hsl('+(hue+Math.random()*40)+',95%,'+(62+Math.random()*20)+'%)',g:95}); }
}
function spawnHeartForm(cx,cy){ // 心形参数方程粒子
  const s=Math.min(W,H)*0.013;
  for(let k=0;k<84;k++){ const t=k/84*TAU;
    const px=16*Math.pow(Math.sin(t),3);
    const py=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    particles.push({type:'form',x:cx,y:cy,tx:cx+px*s,ty:cy+py*s,life:4.4,max:4.4,born:T,
      size:2.2,color:'hsl('+(338+Math.random()*24)+',95%,'+(66+Math.random()*16)+'%)'});
  }
}
function genHearts(){                             // 横向分区+最小间距，按 x 序必有解
  const x0=leftBound+W*0.02, x1=rightBound-W*0.02;
  const yT=H*0.16, yB=Math.min(riverY+60, H*0.84);
  const floor=Math.min(W,H)*0.105;               // 间距下限（更密以容纳极限颗数）
  let minD=Math.min(W,H)*0.175;                  // 期望间距，放不下逐级放宽
  reqHearts=[];
  while(reqHearts.length<HEARTS_N && minD>=floor){
    reqHearts=[]; let guard=0;
    while(reqHearts.length<HEARTS_N && guard++<2500){
      const t=HEARTS_N===1?0.5:reqHearts.length/(HEARTS_N-1);
      const x=clamp(lerp(x0,x1,t)+(Math.random()*2-1)*W*0.02, x0, x1);
      const y=lerp(yT,yB, 0.06+0.88*Math.random());
      let ok=true;
      for(const h of reqHearts) if(dist(x,y,h.x,h.y)<minD){ ok=false; break; }
      if(ok) reqHearts.push({x:x,y:y,got:false});
    }
    if(reqHearts.length<HEARTS_N) minD*=0.90;
  }
  heartsTotal=reqHearts.length;
}
function collectHeartAt(x,y){
  for(const h of reqHearts){
    if(!h.got && dist(x,y,h.x,h.y)<34){
      h.got=true; heartsGot++;
      $('heartNum').textContent=heartsGot+'/'+heartsTotal;
      AU.collect(); vibrate(15); burstHearts(h.x,h.y,10,90);
      particles.push({type:'ring',x:h.x,y:h.y,life:.5,max:.5,size:10});
      if(heartsGot===heartsTotal) toast('爱心集齐！一笔冲向emma 💫');
    }
  }
}
function resetHearts(){
  for(const h of reqHearts) h.got=false;
  heartsGot=0; $('heartNum').textContent='0/'+heartsTotal;
}
/* ---------------- 参考轨迹（x 单调 ⇒ 必不自交） ---------------- */
function buildHintPath(){
  const hs=reqHearts.map(function(h){ return {x:h.x,y:h.y}; })
    .sort(function(a,b){ return a.x-b.x || a.y-b.y; });
  const nodes=[{x:charL.x+6,y:charL.y-34*S}].concat(hs,[{x:charR.x-6,y:charR.y-34*S}]);
  const out=[];
  for(let i=1;i<nodes.length;i++){
    const a=nodes[i-1], b=nodes[i], d=dist(a.x,a.y,b.x,b.y), steps=Math.max(1,Math.ceil(d/9));
    for(let k=0;k<steps;k++) out.push({x:lerp(a.x,b.x,k/steps), y:lerp(a.y,b.y,k/steps)});
  }
  out.push(nodes[nodes.length-1]);
  return out;
}
function drawHintPath(){
  if(!hintPath) return;
  const age=T-hintT0;
  if(age>7.5){ hintPath=null; return; }
  const reveal=clamp(age/2.0,0,1);
  const fade=age>6 ? clamp(1-(age-6)/1.5,0,1) : 1;
  const n=Math.max(2, Math.floor(hintPath.length*reveal));
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.setLineDash([9,9]); ctx.lineDashOffset=-T*46; ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,224,140,'+(0.5*fade).toFixed(3)+')'; ctx.lineWidth=7;
  ctx.beginPath();
  for(let i=0;i<n;i++){ const p=hintPath[i]; if(i) ctx.lineTo(p.x,p.y); else ctx.moveTo(p.x,p.y); }
  ctx.stroke();
  ctx.strokeStyle='rgba(255,250,225,'+(0.95*fade).toFixed(3)+')'; ctx.lineWidth=2.2;
  ctx.beginPath();
  for(let i=0;i<n;i++){ const p=hintPath[i]; if(i) ctx.lineTo(p.x,p.y); else ctx.moveTo(p.x,p.y); }
  ctx.stroke();
  ctx.setLineDash([]);
  if(reveal<1){
    const tip=hintPath[n-1], pu=.5+.5*Math.sin(T*8);
    ctx.fillStyle='rgba(255,245,200,'+(0.6+0.4*pu).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(tip.x,tip.y,3.5+1.5*pu,0,TAU); ctx.fill();
  }
  ctx.restore();
}
function startRound(newHearts){
  hintPath=null;
  if(newHearts || !reqHearts.length) genHearts(); else resetHearts();
  heartsGot=0;                                   // 关键：无论哪个分支都清零计数
  $('heartNum').textContent='0/'+heartsTotal;
  pts=[]; drawing=false; lastLeftStroke=-99;
  $('progressBar').style.width='0%'; $('progressText').textContent='鹊桥 0%';
  phase='play'; playStartT=T;
}
function failRound(msg, x, y){
  drawing=false; flashT=T; hintPath=null;
  for(let i=0;i<26;i++){ const a=Math.random()*TAU, v=50+Math.random()*130;
    particles.push({type:'fire',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.7+Math.random()*.4,max:1,
      size:1.4+Math.random()*1.6,color:'hsl('+(350+Math.random()*20)+',95%,'+(58+Math.random()*18)+'%)',g:60}); }
  AU.fail(); vibrate([60,50,80]);
  pts=[]; resetHearts(); lastLeftStroke=-99;
  $('progressBar').style.width='0%'; $('progressText').textContent='鹊桥 0%';
  toast(msg+' 从猴子重新开始 👈', 2800);
}

/* ---------------- 更新逻辑 ---------------- */
function update(dt){
  // 背景动效
  for(const d of dust){ d.x+=d.sp*dt; if(d.x>W+4) d.x=-4; }
  for(const f of flyers){
    f.x+=f.vx*dt;
    if(f.vx>0 && f.x>W+40){ f.x=-40; f.y=H*(0.1+Math.random()*0.32); }
    if(f.vx<0 && f.x<-40){ f.x=W+40; f.y=H*(0.1+Math.random()*0.32); }
  }
  shootTimer-=dt;
  if(shootTimer<=0){ shootTimer=3.5+Math.random()*5;
    shootingStars.push({x:W*(0.2+Math.random()*0.8), y:H*(0.05+Math.random()*0.35),
      vx:-220-Math.random()*160, vy:90+Math.random()*60, life:.9}); }
  for(let i=shootingStars.length-1;i>=0;i--){ const s=shootingStars[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt; if(s.life<=0) shootingStars.splice(i,1); }

  // 粒子
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life-=dt;
    if(p.type==='heart'||p.type==='fire'){ p.vy+=(p.g||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.type==='fire'){ p.vx*=(1-1.6*dt); p.vy*=(1-0.6*dt); } }
    if(p.life<=0) particles.splice(i,1);
  }
  // 定时事件
  for(let i=events.length-1;i>=0;i--) if(T>=events[i].t){ const e=events.splice(i,1)[0]; e.fn(); }

  if(phase==='play'){
    if(!drawing) for(const p of pts) p.life-=FADE*dt;    // 落笔时不冲淡（一笔画公平性）
    if(pts.length && pts.filter(p=>p.life<=2).length>240) pts=pts.filter(p=>p.life>2);

    const ch=computeChain();
    let pct=0;
    if(ch){
      pct=clamp((ch.farX-leftBound)/(rightBound-leftBound),0,1);
      if(ch.farX>=rightBound){
        if(heartsGot>=heartsTotal){ completeBridge(ch); return; }
        const last=pts[pts.length-1];
        failRound('还有 '+(heartsTotal-heartsGot)+' 颗爱心没穿过！', last.x, last.y);
        return;
      }
    }
    $('progressBar').style.width=(pct*100).toFixed(0)+'%';
    $('progressText').textContent='鹊桥 '+(pct*100).toFixed(0)+'%';
  }
  else if(phase==='walk'){
    walkDL+=walkSpeed*dt; walkDR-=walkSpeed*dt;
    if(walkDL>=walkTotal/2){ walkDL=walkTotal/2; walkDR=walkTotal/2; startMeet(); }
  }
  else if(phase==='meet'){
    if(!update.hb || T-update.hb>0.42){ update.hb=T;
      burstHearts(metPos.x+(Math.random()*30-15), metPos.y-60*S, 2, 40); }
  }
}
function completeBridge(ch){
  phase='walk'; doneT=T; drawing=false; hintPath=null;
  birdsDone=0;
  for(let i=0;i<pts.length;i+=3) if(pts[i].life>ALIVE_MIN) birdsDone++;
  walkPts=[{x:charL.x,y:charL.y-4}]                        // 严格沿玩家笔迹行走
    .concat(pts.map(function(p){ return {x:p.x,y:p.y}; }),
            [{x:charR.x,y:charR.y-4}]);
  walkLens=[0];
  for(let i=1;i<walkPts.length;i++)
    walkLens[i]=walkLens[i-1]+dist(walkPts[i-1].x,walkPts[i-1].y,walkPts[i].x,walkPts[i].y);
  walkTotal=Math.max(walkLens[walkLens.length-1],1);
  walkSpeed=walkTotal/4.6; walkDL=0; walkDR=walkTotal;
  $('progressBar').style.width='100%'; $('progressText').textContent='鹊桥完成 💞';
  AU.fanfare(); vibrate([30,60,90]);
  toast('鹊桥搭好啦！他们来了 ✨');
}
function posAt(d){
  d=clamp(d,0,walkTotal);
  let i=1; while(i<walkLens.length-1 && walkLens[i]<d) i++;
  const seg=Math.max(walkLens[i]-walkLens[i-1],0.001);
  const t=(d-walkLens[i-1])/seg;
  return {x:lerp(walkPts[i-1].x,walkPts[i].x,t), y:lerp(walkPts[i-1].y,walkPts[i].y,t)};
}
function startMeet(){
  phase='meet'; metPos=posAt(walkTotal/2);
  AU.meetChord(); vibrate([40,80,120]);
  spawnHeartForm(W/2, H*0.36);
  burstHearts(metPos.x, metPos.y-40*S, 16, 130);
  const delays=[0.3,0.8,1.3,1.9,2.4,3.0];
  for(const d of delays)
    events.push({t:T+d, fn:function(){ spawnFirework(W*(0.2+0.6*Math.random()), H*(0.16+0.3*Math.random())); }});
  events.push({t:T+2.7, fn:showEnd});
}

/* ---------------- 绘制 ---------------- */
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#050218'); g.addColorStop(.45,'#0e0a38');
  g.addColorStop(.75,'#1b1050'); g.addColorStop(1,'#2a1560');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 月亮（七夕蛾眉月）
  const mx=W*0.84, my=H*0.13, mr=Math.min(W,H)*0.042;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const rg=ctx.createRadialGradient(mx,my,mr*.2,mx,my,mr*3);
  rg.addColorStop(0,'rgba(255,240,210,.32)'); rg.addColorStop(1,'rgba(255,240,210,0)');
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(mx,my,mr*3,0,TAU); ctx.fill(); ctx.restore();
  ctx.fillStyle='#fff4d6'; ctx.beginPath(); ctx.arc(mx,my,mr,0,TAU); ctx.fill();
  ctx.fillStyle='#0d0934'; ctx.beginPath(); ctx.arc(mx-mr*.42,my-mr*.16,mr*.9,0,TAU); ctx.fill();
  // 星星与流星
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const s of stars){
    const a=.35+.65*(.5+.5*Math.sin(T*s.sp+s.ph));
    ctx.fillStyle='rgba(220,230,255,'+a.toFixed(3)+')';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill();
    if(s.r>1.5){ ctx.strokeStyle='rgba(255,255,255,'+(a*.5).toFixed(3)+')'; ctx.lineWidth=.7;
      const L=s.r*3.4; ctx.beginPath();
      ctx.moveTo(s.x-L,s.y); ctx.lineTo(s.x+L,s.y);
      ctx.moveTo(s.x,s.y-L); ctx.lineTo(s.x,s.y+L); ctx.stroke(); }
  }
  for(const s of shootingStars){
    const a=clamp(s.life,0,1);
    const gr=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*.22,s.y-s.vy*.22);
    gr.addColorStop(0,'rgba(255,255,255,'+a.toFixed(3)+')'); gr.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=gr; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*.22,s.y-s.vy*.22); ctx.stroke();
  }
  ctx.restore();
  // 银河
  const bh=H*0.09;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const g2=ctx.createLinearGradient(0,riverY-bh*2,0,riverY+bh*2);
  g2.addColorStop(0,'rgba(130,160,255,0)'); g2.addColorStop(.5,'rgba(150,175,255,.10)');
  g2.addColorStop(1,'rgba(130,160,255,0)');
  ctx.fillStyle=g2; ctx.fillRect(0,riverY-bh*2,W,bh*4);
  for(const d of dust){
    const a=.25+.4*(.5+.5*Math.sin(T*1.4+d.ph));
    ctx.fillStyle='rgba(205,220,255,'+a.toFixed(3)+')';
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,TAU); ctx.fill();
  }
  for(let k=-1;k<=1;k++){
    ctx.strokeStyle='rgba(190,210,255,.07)'; ctx.lineWidth=16;
    ctx.beginPath();
    for(let x=0;x<=W;x+=14){ const y=riverY+k*30+Math.sin(x*0.012+T*1.1+k*2)*7;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    ctx.stroke();
  }
  ctx.restore();
  // 远处飞鸟
  ctx.strokeStyle='rgba(210,220,255,.55)'; ctx.lineWidth=1.6; ctx.lineCap='round';
  for(const f of flyers){
    const fl=Math.sin(T*9+f.ph)*3.6*f.s;
    ctx.beginPath();
    ctx.moveTo(f.x-7*f.s,f.y); ctx.quadraticCurveTo(f.x-3.5*f.s,f.y-fl,f.x,f.y);
    ctx.quadraticCurveTo(f.x+3.5*f.s,f.y-fl,f.x+7*f.s,f.y); ctx.stroke();
  }
}
function drawBank(x){
  const y=riverY+16;
  ctx.fillStyle='#141d4d';
  const blobs=[[0,0,26],[24,5,20],[-26,6,18],[12,-11,18],[-13,-9,16],[38,10,14],[-40,11,13]];
  for(const b of blobs){ ctx.beginPath(); ctx.arc(x+b[0]*S, y+b[1]*S, b[2]*S,0,TAU); ctx.fill(); }
  ctx.strokeStyle='rgba(150,180,255,.20)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(x, y, 26*S, Math.PI*1.05, Math.PI*1.95); ctx.stroke();
}
function drawBridge(){
  if(!pts.length) return;
  const n=pts.length, alive=new Array(n); let any=false;
  for(let i=0;i<n;i++){ alive[i]=pts[i].life>ALIVE_MIN; if(alive[i]) any=true; }
  if(!any) return;
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='rgba(140,205,255,.16)'; ctx.lineWidth=10; ctx.beginPath();  // 光晕
  for(let i=0;i<n-1;i++) if(alive[i]&&alive[i+1]){
    ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[i+1].x,pts[i+1].y); }
  ctx.stroke();
  for(let i=0;i<n-1;i++) if(alive[i]&&alive[i+1]){                            // 亮芯
    const f=pts[i].life/LIFE_MAX;
    ctx.strokeStyle='rgba('+((lerp(255,140,f))|0)+','+((lerp(130,225,f))|0)+','+((lerp(185,250,f))|0)+',.95)';
    ctx.lineWidth=2.4; ctx.beginPath();
    ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[i+1].x,pts[i+1].y); ctx.stroke();
  }
  ctx.restore();
  // 喜鹊（每隔3个点落一只）
  for(let i=0;i<n;i+=3){
    if(!alive[i]) continue;
    const p=pts[i], prev=pts[Math.max(i-2,0)], next=pts[Math.min(i+2,n-1)];
    const dir=(next.x-prev.x)>=0?1:-1;
    const fresh=clamp((p.life-84)/16,0,1);
    const bob=Math.sin(T*3+i)*1.4;
    drawMagpie(p.x, p.y-7+bob, S*(1+fresh*.35)*0.92, dir, p.life);
  }
}
function drawMagpie(x,y,s,dir,life){
  ctx.save(); ctx.translate(x,y); ctx.scale(dir*s,s);
  if(life>ALIVE_MIN+45){ ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(150,220,255,.25)'; ctx.beginPath(); ctx.arc(0,0,12,0,TAU); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#20242e';                       // 身体
  ctx.beginPath(); ctx.ellipse(0,0,7,4.6,0,0,TAU); ctx.fill();
  ctx.fillStyle='#f4f6fb';                       // 白腹
  ctx.beginPath(); ctx.ellipse(-1,1.6,4.6,2.6,0,0,TAU); ctx.fill();
  ctx.fillStyle='#20242e';                       // 头
  ctx.beginPath(); ctx.arc(6,-2.4,3.2,0,TAU); ctx.fill();
  ctx.fillStyle='#f4f6fb';                       // 翼上白斑
  ctx.beginPath(); ctx.ellipse(-2.5,-1.6,3.6,1.7,-.5,0,TAU); ctx.fill();
  ctx.fillStyle='#ffb347';                       // 喙
  ctx.beginPath(); ctx.moveTo(8.8,-2.6); ctx.lineTo(12,-1.6); ctx.lineTo(8.8,-1); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#20242e';                       // 尾
  ctx.beginPath(); ctx.moveTo(-5,-1); ctx.lineTo(-12,-3.4); ctx.lineTo(-11,0.6); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(6.8,-3,0.9,0,TAU); ctx.fill();
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(7,-3,0.45,0,TAU); ctx.fill();
  ctx.restore();
}
/* ---- Q版角色（手绘） ---- */
function drawNiulang(x,y,s,facing,walking,ph){
  ctx.save(); ctx.translate(x,y); ctx.scale(facing*s,s);
  const bob = walking ? Math.abs(Math.sin(ph))*2.2 : Math.sin(T*2)*1;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(120,160,255,.14)'; ctx.beginPath(); ctx.arc(0,-28+bob,26,0,TAU); ctx.fill(); ctx.restore();
  const leg = walking ? Math.sin(ph)*3 : 0;
  ctx.strokeStyle='#2c3a78'; ctx.lineWidth=3.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-3,-12+bob*.3); ctx.lineTo(-3+leg,-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3,-12+bob*.3); ctx.lineTo(3-leg,-1); ctx.stroke();
  ctx.save(); ctx.translate(0,bob);
  const g=ctx.createLinearGradient(0,-34,0,-8); g.addColorStop(0,'#5568c4'); g.addColorStop(1,'#2c3a78');
  ctx.fillStyle=g; ctx.beginPath();                       // 长袍
  ctx.moveTo(-7,-32); ctx.quadraticCurveTo(-13,-14,-11,-8); ctx.lineTo(11,-8);
  ctx.quadraticCurveTo(13,-14,7,-32); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#e8c56a'; ctx.lineWidth=1.6;           // 腰带
  ctx.beginPath(); ctx.moveTo(-9.5,-20); ctx.lineTo(9.5,-20); ctx.stroke();
  ctx.strokeStyle='#8fa0e8'; ctx.lineWidth=2.6;           // 手臂
  ctx.beginPath(); ctx.moveTo(-5,-27); ctx.quadraticCurveTo(-9,-21,-7,-16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5,-27); ctx.quadraticCurveTo(9,-21,7,-16); ctx.stroke();
  ctx.strokeStyle='#a97b4a'; ctx.lineWidth=1.8;           // 扁担+星灯
  ctx.beginPath(); ctx.moveTo(-13,-36); ctx.lineTo(13,-32); ctx.stroke();
  const lamps=[[-13,-36],[13,-32]];
  for(const L of lamps){
    ctx.strokeStyle='#c9a35f'; ctx.beginPath(); ctx.moveTo(L[0],L[1]); ctx.lineTo(L[0],L[1]+5); ctx.stroke();
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,225,140,.35)'; ctx.beginPath(); ctx.arc(L[0],L[1]+8,5.5,0,TAU); ctx.fill(); ctx.restore();
    ctx.fillStyle='#ffe37a'; ctx.beginPath(); ctx.arc(L[0],L[1]+8,2.4,0,TAU); ctx.fill();
  }
  ctx.fillStyle='#2b2440'; ctx.beginPath(); ctx.arc(0,-41,9,0,TAU); ctx.fill();   // 头发
  ctx.beginPath(); ctx.arc(-3.4,-49,3,0,TAU); ctx.fill();                          // 发髻
  ctx.fillStyle='#ffe3c4'; ctx.beginPath(); ctx.arc(0,-40,7.6,0,TAU); ctx.fill();  // 脸
  ctx.fillStyle='#23202e';
  ctx.beginPath(); ctx.arc(2.6,-41,1.05,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6.2,-41,1.05,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(255,130,150,.5)';
  ctx.beginPath(); ctx.arc(1.2,-38.4,1.4,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(7.6,-38.4,1.4,0,TAU); ctx.fill();
  ctx.strokeStyle='#23202e'; ctx.lineWidth=.9;
  ctx.beginPath(); ctx.arc(4.4,-38.6,1.8,.25*Math.PI,.75*Math.PI); ctx.stroke();
  ctx.restore(); ctx.restore();
}
function drawZhinv(x,y,s,facing,walking,ph){
  ctx.save(); ctx.translate(x,y); ctx.scale(facing*s,s);
  const bob = walking ? Math.abs(Math.sin(ph))*2.2 : Math.sin(T*2+1)*1;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(255,150,210,.16)'; ctx.beginPath(); ctx.arc(0,-28+bob,26,0,TAU); ctx.fill(); ctx.restore();
  const leg = walking ? Math.sin(ph)*3 : 0;
  ctx.strokeStyle='#b5588f'; ctx.lineWidth=3.2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-3,-12+bob*.3); ctx.lineTo(-3+leg,-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3,-12+bob*.3); ctx.lineTo(3-leg,-1); ctx.stroke();
  ctx.save(); ctx.translate(0,bob);
  const g=ctx.createLinearGradient(0,-34,0,-6); g.addColorStop(0,'#ff9ec7'); g.addColorStop(1,'#c75f9d');
  ctx.fillStyle=g; ctx.beginPath();                       // 裙
  ctx.moveTo(-6,-32); ctx.quadraticCurveTo(-15,-12,-13,-6); ctx.lineTo(13,-6);
  ctx.quadraticCurveTo(15,-12,6,-32); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#ffd76e'; ctx.lineWidth=1.6;           // 腰带
  ctx.beginPath(); ctx.moveTo(-10,-21); ctx.lineTo(10,-21); ctx.stroke();
  ctx.strokeStyle='rgba(255,211,232,.85)'; ctx.lineWidth=2.4;  // 飘带
  const sx=[-1,1];
  for(let k=0;k<2;k++){ const d=sx[k];
    ctx.beginPath(); ctx.moveTo(d*6,-27);
    ctx.quadraticCurveTo(d*16, -20+Math.sin(T*2.4+d)*3, d*20, -8+Math.sin(T*2.4+d*2)*4); ctx.stroke();
  }
  ctx.strokeStyle='#f0b7d4'; ctx.lineWidth=2.6;           // 手臂
  ctx.beginPath(); ctx.moveTo(-5,-27); ctx.quadraticCurveTo(-9,-21,-7,-16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5,-27); ctx.quadraticCurveTo(9,-21,7,-16); ctx.stroke();
  ctx.strokeStyle='rgba(255,224,140,.8)'; ctx.lineWidth=1;      // 金梭银线
  ctx.beginPath(); ctx.moveTo(7,-16);
  ctx.quadraticCurveTo(16,-24+Math.sin(T*2)*2,22,-18); ctx.stroke();
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(255,235,170,.8)';
  for(let k=0;k<3;k++){ const q=(T*1.2+k/3)%1;
    const qx=lerp(7,22,q), qy=lerp(-16,-18,q)+Math.sin(q*Math.PI)*-6;
    ctx.beginPath(); ctx.arc(qx,qy,1.3,0,TAU); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle='#2b2038'; ctx.beginPath(); ctx.arc(0,-41,9,0,TAU); ctx.fill();   // 头发
  ctx.beginPath(); ctx.arc(-6.4,-47.6,3,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6.4,-47.6,3,0,TAU); ctx.fill();
  for(let k=0;k<5;k++){ const a=k/5*TAU;                    // 头上的花
    ctx.fillStyle='#ff9ec7'; ctx.beginPath();
    ctx.arc(4.8+Math.cos(a)*2.2,-48.6+Math.sin(a)*2.2,1.3,0,TAU); ctx.fill(); }
  ctx.fillStyle='#ffd76e'; ctx.beginPath(); ctx.arc(4.8,-48.6,1.2,0,TAU); ctx.fill();
  ctx.fillStyle='#ffe3c4'; ctx.beginPath(); ctx.arc(0,-40,7.6,0,TAU); ctx.fill();
  ctx.fillStyle='#23202e';
  ctx.beginPath(); ctx.arc(2.6,-41,1.05,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6.2,-41,1.05,0,TAU); ctx.fill();
  ctx.strokeStyle='#23202e'; ctx.lineWidth=.8;              // 睫毛
  ctx.beginPath(); ctx.moveTo(1.6,-42.4); ctx.lineTo(3.6,-43); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5.2,-43); ctx.lineTo(7.2,-42.4); ctx.stroke();
  ctx.fillStyle='rgba(255,130,150,.5)';
  ctx.beginPath(); ctx.arc(1.2,-38.4,1.4,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(7.6,-38.4,1.4,0,TAU); ctx.fill();
  ctx.strokeStyle='#23202e'; ctx.lineWidth=.9;
  ctx.beginPath(); ctx.arc(4.4,-38.8,1.8,.25*Math.PI,.75*Math.PI); ctx.stroke();
  ctx.restore(); ctx.restore();
}
function label(text,x,y,color){
  ctx.font=Math.round(12*S)+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillStyle=color; ctx.fillText(text,x,y);
}
function drawReqHearts(){
  for(const h of reqHearts){
    if(h.got) continue;
    const sc=(11+Math.sin(T*3+h.x*0.1)*1.6)*S;
    const pu=.5+.5*Math.sin(T*2.6+h.y*0.1);
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,110,170,'+(0.10+0.10*pu).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(h.x,h.y,sc*(2.0+0.5*pu),0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(255,170,215,'+(0.35+0.3*pu).toFixed(3)+')'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(h.x,h.y,sc*1.9,0,TAU); ctx.stroke();
    ctx.restore();
    drawHeart(h.x,h.y,sc,'#ff5f9e','#ffc2dc');
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,255,255,'+(0.5+0.5*pu).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(h.x-sc*.35,h.y-sc*.45,sc*.16+0.6,0,TAU); ctx.fill(); ctx.restore();
  }
}
function drawHeart(x,y,s,c1,c2,alpha){
  if(alpha===undefined) alpha=1;
  ctx.save(); ctx.globalAlpha=alpha;
  const g=ctx.createLinearGradient(x,y-s,x,y+s);
  g.addColorStop(0,c2); g.addColorStop(1,c1);
  ctx.fillStyle=g; ctx.beginPath();
  ctx.moveTo(x,y+s*.85);
  ctx.bezierCurveTo(x-s*1.15,y+s*.12,x-s*.9,y-s*.78,x,y-s*.28);
  ctx.bezierCurveTo(x+s*.9,y-s*.78,x+s*1.15,y+s*.12,x,y+s*.85);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawParticles(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const p of particles){
    const a=clamp(p.life/p.max,0,1);
    if(p.type==='ring'){
      const r=p.size+(1-a)*36;
      ctx.strokeStyle='rgba(255,180,215,'+(a*.7).toFixed(3)+')'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.stroke();
    }else if(p.type==='heart'){
      drawHeart(p.x,p.y,p.size*a+2,'rgba(0,0,0,0)',p.color, a);
      drawHeart(p.x,p.y,p.size*a+6,'rgba(0,0,0,0)',p.color, a*.5);
    }else if(p.type==='fire'){
      ctx.fillStyle=p.color; ctx.globalAlpha=a;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a+.3,0,TAU); ctx.fill(); ctx.globalAlpha=1;
    }else if(p.type==='form'){
      const t=clamp((T-p.born)/1.1,0,1), e=1-Math.pow(1-t,3);
      const x=lerp(p.x,p.tx,e), y=lerp(p.y,p.ty,e);
      const tw=.5+.5*Math.sin(T*6+p.tx);
      ctx.fillStyle=p.color; ctx.globalAlpha=a*(0.55+0.45*tw);
      ctx.beginPath(); ctx.arc(x,y,p.size,0,TAU); ctx.fill(); ctx.globalAlpha=1;
    }
  }
  ctx.restore();
}
function drawHint(){
  if(phase!=='play') return;
  if(T-lastLeftStroke<=3.2) return;
  const pl=.5+.5*Math.sin(T*4);
  ctx.save();
  ctx.strokeStyle='rgba(255,200,235,'+((.35+.4*pl)).toFixed(3)+')'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(charL.x, charL.y-30*S, 24*S+pl*7, 0, TAU); ctx.stroke();
  ctx.font=Math.round(22*S)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('👆', charL.x, charL.y-78*S - Math.abs(Math.sin(T*4))*10);
  ctx.font=Math.round(15*S)+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle='rgba(255,220,240,'+((.6+.35*pl)).toFixed(3)+')';
  ctx.fillText('从猴子一笔画到emma，穿过所有爱心', W/2, H*0.24);
  ctx.fillText('（一笔完成 · 线条不能交叉 · 不能断笔）', W/2, H*0.24+20*S);
  ctx.restore();
}
function draw(){
  drawSky();
  drawBank(charL.x); drawBank(charR.x);
  if(phase==='play'||phase==='walk'||phase==='meet'||phase==='end') drawBridge();
  drawReqHearts();
  if(phase==='play') drawHintPath();

  if(phase==='play'||phase==='start'||phase==='story'){
    drawAvatar('L',charL.x,charL.y,S, 1,false,0);  label('猴子',charL.x,charL.y+8,'rgba(170,215,255,.9)');
    drawAvatar('R',charR.x,charR.y,S,-1,false,0);  label('emma',charR.x,charR.y+8,'rgba(255,205,235,.9)');
  }else if(phase==='walk'){
    const pL=posAt(walkDL), pR=posAt(walkDR);
    const fL=(posAt(Math.min(walkDL+4,walkTotal)).x-pL.x)>=0?1:-1;
    const fR=(posAt(Math.max(walkDR-4,0)).x-pR.x)>=0?1:-1;
    drawAvatar('L',pL.x,pL.y,S, fL,true,walkDL*.16); label('猴子',pL.x,pL.y+8,'rgba(170,215,255,.9)');
    drawAvatar('R',pR.x,pR.y,S, fR,true,(walkTotal-walkDR)*.16); label('emma',pR.x,pR.y+8,'rgba(255,205,235,.9)');
  }else if(phase==='meet'||phase==='end'){
    const p=metPos;
    drawAvatar('L',p.x-15*S,p.y,S, 1,false,0); label('猴子',p.x-15*S,p.y+8,'rgba(170,215,255,.9)');
    drawAvatar('R',p.x+15*S,p.y,S,-1,false,0); label('emma',p.x+15*S,p.y+8,'rgba(255,205,235,.9)');
  }
  drawParticles();
  drawHint();
  if(T-flashT<0.35){                              // 失败红闪
    ctx.fillStyle='rgba(255,60,90,'+(0.30*(1-(T-flashT)/0.35)).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
}

/* ---------------- 主循环 ---------------- */
let lastTs=performance.now();
function loop(ts){
  const dt=Math.min(.05,(ts-lastTs)/1000); lastTs=ts; T+=dt;
  update(dt); draw();
  requestAnimationFrame(loop);
}

/* ---------------- 交互（触摸/鼠标统一） ---------------- */
function ptOf(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
cv.addEventListener('pointerdown', function(e){
  AU.init(); AU.resume();
  const p=ptOf(e);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(phase==='play'){
    if(p.x > leftBound+W*0.08){                    // 必须从猴子出发
      toast('要从猴子这里开始画哦 👈', 1800);
      return;
    }
    drawing=true; lastLeftStroke=T;
    addPathPoint(p.x,p.y); ripple(p.x,p.y);
  }else if(phase==='walk'||phase==='meet'||phase==='end'){
    ripple(p.x,p.y); burstHearts(p.x,p.y,4,60); AU.pop();
  }
},{passive:true});
cv.addEventListener('pointermove', function(e){
  if(!drawing || phase!=='play') return;
  const p=ptOf(e); addPathPoint(p.x,p.y);
},{passive:true});
function endStroke(){
  if(!drawing) return; drawing=false;
  if(phase==='play' && pts.length && pts[pts.length-1].x < rightBound-W*0.02)
    failRound('断笔啦！要一笔画到emma', pts[pts.length-1].x, pts[pts.length-1].y);
}
cv.addEventListener('pointerup', endStroke,{passive:true});
cv.addEventListener('pointercancel', endStroke,{passive:true});
window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------------- UI ---------------- */
let toastTimer=0;
function toast(msg, ms){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); }, ms||2600);
}
$('startBtn').addEventListener('click', function(){
  AU.init(); AU.resume();
  $('startScreen').classList.add('hidden');
  $('storyScreen').classList.remove('hidden');
  phase='story';
});
$('storyBtn').addEventListener('click', function(){
  $('storyScreen').classList.add('hidden');
  $('hud').classList.remove('hidden');
  startRound(true);
  toast('穿过所有爱心，一笔画到emma（不能交叉）💫', 3600);
});
$('hintBtn').addEventListener('click', function(){
  if(phase!=='play') return;
  AU.init(); AU.resume();
  hintPath=buildHintPath(); hintT0=T;
  AU.collect(); vibrate(10);
  toast('参考轨迹来啦 ✨ 照着画一遍', 2600);
});
$('muteBtn').addEventListener('click', function(){
  AU.init(); AU.setMuted(!AU.muted);
  $('muteBtn').textContent=AU.muted?'🔇':'🔊';
});
$('againBtn').addEventListener('click', function(){
  $('endScreen').classList.add('hidden');
  particles=[]; events=[]; shootingStars=[];
  startRound(true);
  toast('新的爱心布局，再为TA搭一次 💞');
});
function buildMessage(){
  const me=$('meName').value.trim()||'猴子';
  const ta=$('taName').value.trim()||'emma';
  return ta+'，七夕快乐！\n'
    +'银河三千丈，不及相思一寸长。\n'
    +'这座鹊桥，是我一笔一笔为你搭的——\n'
    +'愿岁岁年年，与你相会。\n'
    +'—— 爱你的 '+me;
}
function showEnd(){
  phase='end';
  $('stTime').textContent=(doneT-playStartT).toFixed(1)+'s';
  $('stBirds').textContent=birdsDone;
  $('stHearts').textContent=heartsTotal;
  $('endMsg').textContent=buildMessage();
  lastRecTs=Date.now();
  const top=saveRecord(lastRecTs), best=top[0];
  $('bestLine').textContent='🏆 历史最高：'+(best?best.m:0)+' 只喜鹊'
    +((best&&best.ts===lastRecTs)?' · 新纪录！🎉':'');
  $('endScreen').classList.remove('hidden');
}
/* ---------------- 排行榜（localStorage 本机记录） ---------------- */
const BOARD_KEY='qixi.board.v1';
function loadBoard(){
  try{ return JSON.parse(localStorage.getItem(BOARD_KEY)||'[]'); }catch(e){ return []; }
}
function fmtDate(ts){
  const d=new Date(ts), p=n=>(n<10?'0':'')+n;
  return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function saveRecord(ts){                         // 记录本轮：喜鹊数多者胜，同数比用时
  const b=loadBoard();
  b.push({m:birdsDone, n:heartsTotal, t:+(doneT-playStartT).toFixed(1), d:fmtDate(ts),
          w:($('meName').value.trim()||'猴子')+' ❤ '+($('taName').value.trim()||'emma'), ts:ts});
  b.sort(function(x,y){ return (y.m-x.m)||(x.t-y.t); });
  const top=b.slice(0,10);
  try{ localStorage.setItem(BOARD_KEY, JSON.stringify(top)); }catch(e){}
  return top;
}
function renderBoard(newTs){
  const b=loadBoard();                             // 排序兜底：喜鹊多者在前，同数耗时少者在前
  b.sort(function(x,y){ return (y.m-x.m)||(x.t-y.t)||(x.ts-y.ts); });
  const el=$('boardList');
  if(!b.length){
    el.innerHTML='<p class="tip" style="text-align:center">还没有记录<br>完成一局，为TA搭起最长的鹊桥 🐦</p>';
    return;
  }
  const medal=['🥇','🥈','🥉'];
  el.innerHTML=b.map(function(e,i){
    return '<div class="brow'+(e.ts===newTs?' new':'')+'">'
      +'<span class="rk">'+(medal[i]||('#'+(i+1)))+'</span>'
      +'<span class="bm"><b>'+e.m+'</b> 只喜鹊 · '+e.n+' 颗爱心 · '+e.t+'s'
      +'<br><span style="color:#8f80c0;font-size:11px">'+e.w+'</span></span>'
      +'<span class="bd">'+e.d+(e.ts===newTs?'<br>🔥 新上榜':'')+'</span>'
      +'</div>';
  }).join('');
}
function openBoard(newTs){ renderBoard(newTs); $('boardScreen').classList.remove('hidden'); }
$('boardBtn').addEventListener('click', function(){ openBoard(0); });
$('boardEndBtn').addEventListener('click', function(){ openBoard(lastRecTs); });
$('boardClose').addEventListener('click', function(){ $('boardScreen').classList.add('hidden'); });

/* ---------------- 启动 ---------------- */
layout();
requestAnimationFrame(loop);
</script>
